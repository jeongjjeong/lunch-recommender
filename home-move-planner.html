<title>우리집 갈아타기 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#18212B; --muted:#5B6776; --line:#D5DBE2;
  --accent:#2B3F8C; --accent-soft:#E2E7F6; --stamp:#B8322A; --stamp-soft:#F7E3E1;
  --good:#1D7A4C; --good-soft:#DFF1E7; --warn:#9A6A00; --warn-soft:#FBF0D2;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#12171D; --panel:#1B222B; --ink:#E6EAEF; --muted:#98A3B1; --line:#2D3743;
  --accent:#9DB0F2; --accent-soft:#25304F; --stamp:#F08A80; --stamp-soft:#3E2322;
  --good:#6FD19E; --good-soft:#1C3629; --warn:#E8C063; --warn-soft:#3A3018;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12171D; --panel:#1B222B; --ink:#E6EAEF; --muted:#98A3B1; --line:#2D3743;
  --accent:#9DB0F2; --accent-soft:#25304F; --stamp:#F08A80; --stamp-soft:#3E2322;
  --good:#6FD19E; --good-soft:#1C3629; --warn:#E8C063; --warn-soft:#3A3018;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.status{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:700}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.tab{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.02em}
.tile .v{font-family:var(--mono);font-size:20px;font-weight:500;margin-top:4px}
.tile .d{font-size:12px;color:var(--muted);margin-top:2px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
td.r,th.r{text-align:right}
tr.best td{background:var(--stamp-soft)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--stamp-soft);color:var(--stamp)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);font-weight:700;font-size:11px;padding:0 6px;border-radius:4px;transform:rotate(-4deg);letter-spacing:.05em}
button.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.btn.danger{color:var(--stamp)}
button.link{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:12px;padding:2px 4px}
button.link.del{color:var(--stamp)}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f.wide{grid-column:1/-1}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:60px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.formbar{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.note{font-size:12px;color:var(--muted);max-width:32ch}
.by{font-size:11px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
ul.todo{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
ul.todo li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
ul.todo li.done span.t{color:var(--muted);text-decoration:line-through}
ul.todo li span.t{flex:1}
.guide{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.guide p{margin:0}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:13px}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-size:13px;margin-top:8px}
.breakdown .tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px}
@media (prefers-reduced-motion:no-preference){nav button{transition:color .15s,border-color .15s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>우리집 갈아타기 계산기</h1>
      <p class="sub">파는 집 · 살 집 · 은행 대출을 한곳에 모아 두 사람이 같은 숫자를 봅니다. 금액 단위는 모두 <b>만원</b>입니다.</p>
    </div>
    <div class="row" style="justify-content:flex-end">
      <label class="who" for="who">입력하는 사람
        <select id="who" style="width:auto"><option>경한</option><option>정현</option></select>
      </label>
      <span class="status" id="status">불러오는 중…</span>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="summary" aria-selected="true">한눈에 비교</button>
    <button role="tab" data-tab="sells">매도</button>
    <button role="tab" data-tab="buys">매수 후보</button>
    <button role="tab" data-tab="loans">대출 조건</button>
    <button role="tab" data-tab="comps">시세 기록</button>
    <button role="tab" data-tab="plan">체크리스트</button>
    <button role="tab" data-tab="settings">우리 정보</button>
  </nav>

  <section class="tab" id="tab-summary"></section>
  <section class="tab" id="tab-sells" hidden></section>
  <section class="tab" id="tab-buys" hidden></section>
  <section class="tab" id="tab-loans" hidden></section>
  <section class="tab" id="tab-comps" hidden></section>
  <section class="tab" id="tab-plan" hidden></section>
  <section class="tab" id="tab-settings" hidden></section>
</div>

<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => { const x = parseFloat(String(v ?? "").replace(/,/g,"")); return isFinite(x) ? x : 0; };
const has = v => v !== undefined && v !== null && String(v).trim() !== "";
function won(m){ // m = 만원
  if (!isFinite(m)) return "-";
  const neg = m < 0; m = Math.round(Math.abs(m));
  const eok = Math.floor(m/10000), man = m%10000;
  let s = eok ? eok.toLocaleString()+"억" + (man ? " "+man.toLocaleString()+"만" : "") : man.toLocaleString()+"만";
  return (neg ? "−" : "") + s;
}
const pct = (x,d=2) => (isFinite(x) ? x.toFixed(d) : "-") + "%";
const ls = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

// ---------- Korean rules (2026 기준 추정, 반드시 확인) ----------
// 매매 중개보수 법정 상한요율 (2021.10 개정)
function brokerCap(price){ // 만원
  if (price < 5000) return {rate:0.6, max:25};
  if (price < 20000) return {rate:0.5, max:80};
  if (price < 90000) return {rate:0.4};
  if (price < 120000) return {rate:0.5};
  if (price < 150000) return {rate:0.6};
  return {rate:0.7};
}
function brokerFee(price, rateOverride, vat){
  const cap = brokerCap(price);
  const rate = has(rateOverride) ? n(rateOverride) : cap.rate;
  let fee = price * rate / 100;
  if (!has(rateOverride) && cap.max) fee = Math.min(fee, cap.max);
  if (vat) fee *= 1.1;
  return {fee, rate, capRate:cap.rate};
}
// 1주택(일시적 2주택 포함) 유상취득 취득세
function acqTax(price, over85){
  const eok = price/10000;
  let r;
  if (eok <= 6) r = 1;
  else if (eok <= 9) r = eok*2/3 - 3;
  else r = 3;
  r = Math.round(r*100)/100;
  const edu = r * 0.1;           // 지방교육세
  const farm = over85 ? 0.2 : 0; // 농어촌특별세
  const total = r + edu + farm;
  return {rate:r, total, amount: price*total/100};
}
function payment(P, ratePct, years){
  const r = ratePct/100/12, N = Math.max(1, Math.round(years*12));
  if (P <= 0) return 0;
  if (r === 0) return P/N;
  return P*r/(1-Math.pow(1+r,-N));
}
function interestPaid(P, ratePct, years, months){
  const r = ratePct/100/12, M = payment(P, ratePct, years);
  const k = Math.min(months, Math.round(years*12));
  if (P <= 0) return 0;
  if (r === 0) return 0;
  const g = Math.pow(1+r,k);
  const bal = P*g - M*(g-1)/r;
  return M*k - (P - bal);
}

// ---------- schemas ----------
const SCHEMAS = {
  sells: { title:"매도 제안·시나리오", addLabel:"매도가 추가", fields:[
    {k:"label", l:"이름 (예: A부동산 제안, 목표가)", t:"text", req:true},
    {k:"price", l:"매도가 (만원)", t:"num", req:true},
    {k:"brokerRate", l:"중개보수율 % (비우면 법정 상한)", t:"num"},
    {k:"cgt", l:"양도세 추정 (만원)", t:"num", hint:"1세대1주택 비과세·12억 이하면 0. 세무사 확인 권장"},
    {k:"extra", l:"이사·청소·기타 (만원)", t:"num"},
    {k:"date", l:"잔금 가능일", t:"text"},
    {k:"note", l:"메모 (조건, 협상 여지)", t:"area"} ]},
  buys: { title:"매수 후보", addLabel:"매수 후보 추가", fields:[
    {k:"label", l:"단지 · 동 · 평형", t:"text", req:true},
    {k:"price", l:"매수가 (만원)", t:"num", req:true},
    {k:"kb", l:"KB시세 (만원, 비우면 매수가)", t:"num", hint:"주담대 한도는 KB시세 기준"},
    {k:"over85", l:"전용 85㎡ 초과 (농특세 0.2%)", t:"chk"},
    {k:"brokerRate", l:"중개보수율 % (비우면 법정 상한)", t:"num"},
    {k:"interior", l:"인테리어 견적 (만원)", t:"num"},
    {k:"moving", l:"이사비 (만원)", t:"num"},
    {k:"legal", l:"등기·법무사·채권 (만원)", t:"num", hint:"비우면 매수가의 0.15%로 추정"},
    {k:"date", l:"입주 가능일", t:"text"},
    {k:"note", l:"메모 (장단점, 협상 포인트)", t:"area"} ]},
  loans: { title:"대출 조건", addLabel:"은행 조건 추가", fields:[
    {k:"kind", l:"대출 종류", t:"sel", opts:["주담대","신용·기타"], hint:"주담대로 부족한 금액은 신용·기타 대출로 채워 계산"},
    {k:"bank", l:"은행·대출자", t:"text", req:true},
    {k:"product", l:"상품명", t:"text"},
    {k:"type", l:"금리 방식", t:"sel", opts:["혼합형(5년 고정)","고정형","변동형","주기형"]},
    {k:"rate", l:"기본 금리 %", t:"num", req:true},
    {k:"discount", l:"우대금리 %p (특약 충족 시)", t:"num"},
    {k:"conditions", l:"특약·우대 조건", t:"text", hint:"예: 급여이체, 카드 월 30만, 청약 가입"},
    {k:"condCost", l:"특약 유지비용 (만원/월)", t:"num", hint:"조건 맞추느라 추가로 드는 돈"},
    {k:"max", l:"은행 제시 한도 (만원)", t:"num"},
    {k:"years", l:"대출 기간 (년)", t:"num"},
    {k:"prepay", l:"중도상환수수료 %", t:"num"},
    {k:"note", l:"메모", t:"area"} ]},
  comps: { title:"시세 기록", addLabel:"시세 추가", fields:[
    {k:"side", l:"구분", t:"sel", opts:["우리집(매도)","매수 후보"]},
    {k:"complex", l:"단지", t:"text", req:true},
    {k:"area", l:"전용면적·평형", t:"text"},
    {k:"floor", l:"층", t:"text"},
    {k:"kind", l:"종류", t:"sel", opts:["실거래가","호가","급매"]},
    {k:"price", l:"가격 (만원)", t:"num", req:true},
    {k:"date", l:"거래·확인일", t:"text"},
    {k:"note", l:"메모", t:"text"} ]},
};
const SETTINGS_FIELDS = [
  {k:"cash", l:"보유 현금·예금 (만원)", t:"num"},
  {k:"payoff", l:"지금 집 대출 잔액 (만원)", t:"num", hint:"매도 시 상환"},
  {k:"payoffFee", l:"기존 대출 중도상환수수료 (만원)", t:"num"},
  {k:"income", l:"부부 합산 연소득 (만원)", t:"num", hint:"DSR 계산용"},
  {k:"otherDebt", l:"기타 대출 연 원리금 (만원)", t:"num"},
  {k:"stress", l:"스트레스 가산금리 %p", t:"num", hint:"수도권·규제지역은 은행에 확인"},
  {k:"dsrLimit", l:"DSR 한도 %", t:"num"},
  {k:"ltv", l:"LTV %", t:"num", hint:"지역·규제에 따라 다름"},
  {k:"cap", l:"주담대 절대한도 (만원)", t:"num", hint:"정부 대책상 상한, 은행 확인"},
  {k:"roomDeduct", l:"방공제 (만원)", t:"num", hint:"소액임차보증금 공제. 과밀억제권역 4,800"},
  {k:"horizon", l:"비교 기간 (년)", t:"num", hint:"이 기간 이자+특약비용으로 비교"},
  {k:"vat", l:"중개보수에 부가세 10% 포함", t:"chk"},
];
const DEFAULT_SETTINGS = {cash:"", payoff:"", payoffFee:"", income:"", otherDebt:"", stress:"1.5", dsrLimit:"40", ltv:"70", cap:"60000", roomDeduct:"", horizon:"5", vat:true};

// ---------- state & storage ----------
const state = { sells:[], buys:[], loans:[], comps:[], todos:[], settings:{...DEFAULT_SETTINGS}, pickedSell:null };
let db = null, shared = false, readOnly = false;
const local = { sells:{}, buys:{}, loans:{}, comps:{}, todos:{} };
let tab = ls.get("tab") || "summary";
const editing = {}; // coll -> id|"new"
const confirmDel = {};

const whoSel = $("#who");
whoSel.value = ls.get("who") || "경한";
whoSel.addEventListener("change", () => ls.set("who", whoSel.value));

function setStatus(t){ $("#status").textContent = t; }
function banner(t){ const b=$("#banner"); b.textContent=t||""; b.hidden=!t; }

async function saveDoc(coll, id, data){
  data = {...data, by: whoSel.value, at: new Date().toISOString()};
  if (!shared){ local[coll][id] = {id, ...data}; syncLocal(coll); return; }
  try { await db.collection(coll).doc(id).set(data); }
  catch(e){ handleErr(e); }
}
async function delDoc(coll, id){
  if (!shared){ delete local[coll][id]; syncLocal(coll); return; }
  try { await db.collection(coll).doc(id).delete(); } catch(e){ handleErr(e); }
}
async function saveSettings(s){
  state.settings = s;
  if (!shared){ render(); return; }
  try { await db.doc("plan/settings").set(s); } catch(e){ handleErr(e); }
}
function handleErr(e){
  if (e && e.code === "invalid_argument"){ readOnly = true; banner("이 화면에서는 보기만 할 수 있어요. 수정하려면 공유 권한을 '편집 가능'으로 받아야 합니다."); render(); return; }
  if (e && e.code === "quota_exceeded"){ banner("저장 공간이 가득 찼어요. 오래된 시세 기록을 지워 주세요."); return; }
  banner("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
}
function syncLocal(coll){ state[coll] = Object.values(local[coll]); render(); }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

// ---------- computations ----------
function sellCalc(s){
  const S = state.settings, price = n(s.price);
  const b = brokerFee(price, s.brokerRate, !!S.vat);
  const cgt = n(s.cgt), extra = n(s.extra), payoff = n(S.payoff) + n(S.payoffFee);
  const net = price - b.fee - cgt - extra - payoff;
  return {price, broker:b, cgt, extra, payoff, net};
}
function buyCalc(b){
  const S = state.settings, price = n(b.price);
  const tax = acqTax(price, !!b.over85);
  const br = brokerFee(price, b.brokerRate, !!S.vat);
  const legal = has(b.legal) ? n(b.legal) : price*0.0015;
  const interior = n(b.interior), moving = n(b.moving);
  const extras = tax.amount + br.fee + legal + interior + moving;
  return {price, tax, broker:br, legal, interior, moving, extras, total: price + extras};
}
const isSub = l => l.kind === "신용·기타";
function mainLimit(loan, base){
  const S = state.settings;
  const limits = [Math.max(0, base * (has(S.ltv) ? n(S.ltv) : 70)/100 - n(S.roomDeduct))];
  if (has(S.cap)) limits.push(n(S.cap));
  if (has(loan.max)) limits.push(n(loan.max));
  return Math.min(...limits);
}
function loanCost(loan, amt){
  const S = state.settings;
  const rate = n(loan.rate) - n(loan.discount);
  const years = n(loan.years) || (isSub(loan) ? 5 : 30);
  const H = Math.max(1, n(S.horizon) || 5);
  const monthly = payment(amt, rate, years);
  const stressMonthly = payment(amt, rate + (isSub(loan) ? 0 : n(S.stress)), years);
  const interest = interestPaid(amt, rate, years, H*12);
  const cond = amt > 0 ? n(loan.condCost) * 12 * H : 0;
  return {rate, years, amt, monthly, stressMonthly, interest, cond, cost: interest + cond, H};
}
// 주담대를 한도까지 쓰고, 모자라면 신용·기타 대출로 채우는 조합 중 가장 싼 것
function financing(need, base){
  const S = state.settings;
  if (need <= 0) return {need, parts:[], ok:true, cost:0, monthly:0, dsr:NaN};
  const mains = state.loans.filter(l => !isSub(l)), subs = state.loans.filter(isSub);
  const plans = [];
  const tryMain = m => {
    const lim = m ? mainLimit(m, base) : 0;
    const mainAmt = Math.min(need, lim);
    const rest = need - mainAmt;
    const parts = m && mainAmt > 0 ? [{loan:m, c:loanCost(m, mainAmt), limit:lim}] : [];
    if (rest <= 0.5){ plans.push({parts, ok:true}); return; }
    const fits = subs.filter(x => !has(x.max) || n(x.max) >= rest - 0.5).map(x => ({loan:x, c:loanCost(x, rest), limit: has(x.max) ? n(x.max) : Infinity}));
    fits.sort((a,b) => a.c.cost - b.c.cost);
    if (fits[0]) plans.push({parts:[...parts, fits[0]], ok:true});
    else plans.push({parts, ok:false, short: rest});
  };
  if (mains.length) mains.forEach(tryMain); else tryMain(null);
  plans.forEach(p => {
    p.cost = p.parts.reduce((a,x) => a + x.c.cost, 0);
    p.monthly = p.parts.reduce((a,x) => a + x.c.monthly, 0);
    const inc = n(S.income);
    p.dsr = inc > 0 ? (p.parts.reduce((a,x) => a + x.c.stressMonthly, 0)*12 + n(S.otherDebt)) / inc * 100 : NaN;
    p.dsrOk = !isFinite(p.dsr) || p.dsr <= (n(S.dsrLimit) || 40);
    p.need = need;
  });
  plans.sort((a,b) => (b.ok && b.dsrOk) - (a.ok && a.dsrOk) || a.cost - b.cost);
  return plans[0] || {need, parts:[], ok:false, short:need, cost:0, monthly:0, dsr:NaN, dsrOk:true};
}
function bestSell(){
  if (!state.sells.length) return null;
  const picked = state.sells.find(s => s.id === state.pickedSell);
  if (picked) return picked;
  return [...state.sells].sort((a,b) => sellCalc(b).net - sellCalc(a).net)[0];
}
function combos(){
  const sell = bestSell();
  const sellNet = sell ? sellCalc(sell).net : 0;
  const cash = n(state.settings.cash);
  return state.buys.map(b => {
    const bc = buyCalc(b);
    const need = bc.total - sellNet - cash;
    const plan = financing(need, has(b.kb) ? n(b.kb) : bc.price);
    const feasible = need <= 0 || (plan.ok && plan.dsrOk);
    return {buy:b, bc, need, plan, feasible, moveCost: bc.extras + (need > 0 ? plan.cost : 0)};
  }).sort((a,b) => (b.feasible - a.feasible) || (a.moveCost - b.moveCost));
}
const partName = p => `${esc(p.loan.bank)} ${won(p.c.amt)}`;

    const rows = state.comps.filter(c => (c.side||"우리집(매도)") === side).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    const real = rows.filter(r => r.kind === "실거래가").map(r => n(r.price)).sort((a,b)=>a-b);
    const ask = rows.filter(r => r.kind !== "실거래가").map(r => n(r.price));
    const med = real.length ? real[Math.floor(real.length/2)] : NaN;
    h += `<div class="panel"><div class="row"><h3>${side}</h3><span class="hint">실거래 중간값 <b class="num">${isFinite(med)?won(med):"-"}</b> · 호가 최저 <b class="num">${ask.length?won(Math.min(...ask)):"-"}</b></span></div>
    <div class="scroll"><table><thead><tr><th>단지</th><th>면적</th><th>층</th><th>종류</th><th class="r">가격</th><th>날짜</th><th>메모</th><th></th></tr></thead><tbody>
    ${rows.length ? rows.map(r => `<tr><td>${esc(r.complex)}</td><td>${esc(r.area)}</td><td>${esc(r.floor)}</td><td><span class="pill ${r.kind==="실거래가"?"info":r.kind==="급매"?"warn":"good"}">${esc(r.kind)}</span></td><td class="r num">${won(n(r.price))}</td><td>${esc(r.date)}</td><td class="note">${esc(r.note)}</td><td>${actions("comps", r)}</td></tr>`).join("") : `<tr><td colspan="8" class="hint">기록 없음</td></tr>`}
    </tbody></table></div></div>`;
  });
  return h;
}
function renderPlan(){
  const todos = [...state.todos].sort((a,b) => (n(a.order)-n(b.order)) || String(a.at).localeCompare(String(b.at)));
  const done = todos.filter(t => t.done).length;
  let h = `<div class="cols2"><div class="panel"><div class="row"><h2>같이 챙길 일</h2><span class="pill info">${done}/${todos.length} 완료</span></div>
    <ul class="todo">${todos.map(t => `<li class="${t.done?"done":""}"><input type="checkbox" aria-label="완료" data-act="toggle" data-id="${esc(t.id)}" ${t.done?"checked":""} ${readOnly?"disabled":""}><span class="t">${esc(t.text)}<span class="by"> ${t.by?"· "+esc(t.by):""}</span></span>${readOnly?"":`<button class="link del" data-act="del" data-coll="todos" data-id="${esc(t.id)}">${confirmDel.todos===t.id?"정말 삭제":"삭제"}</button>`}</li>`).join("")}</ul>
    ${readOnly?"":`<form data-form="todo" class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="todo-text" name="text" placeholder="할 일 추가" required><button class="btn primary" type="submit">추가</button></form>`}
  </div>
  <div class="panel guide"><h2>좋은 가격에 팔고 사는 순서</h2>
    <ol>
      <li><b>시세부터 쌓기.</b> 우리 단지와 후보 단지의 최근 실거래가·호가를 '시세 기록'에 모읍니다. 매도 호가와 매수 협상가의 근거가 됩니다.</li>
      <li><b>대출 한도를 먼저 확정.</b> 은행 3곳 이상에서 사전 한도·금리를 받아 '대출 조건'에 넣으면 살 수 있는 최대 가격이 정해집니다.</li>
      <li><b>매도 먼저, 또는 잔금일 맞추기.</b> 매도 잔금일이 매수 잔금일보다 앞서게 계약하면 브릿지 자금이 필요 없습니다. 먼저 사야 한다면 일시적 2주택 처분 기한을 확인하세요.</li>
      <li><b>중개보수는 상한이지 고정가가 아닙니다.</b> 계약 전에 요율을 협의하고 '매도/매수' 탭의 중개보수율에 반영하세요.</li>
      <li><b>후보별 총 부대비용 비교.</b> '한눈에 비교'에서 집값이 비슷하면 부대비용이 적은 곳, 월 상환이 소득 대비 부담 없는 곳을 고릅니다.</li>
      <li><b>계약서 특약 챙기기.</b> 대출 불가 시 계약 해제, 누수 등 하자 처리, 잔금일 조정 가능 여부를 특약으로 적어 두세요.</li>
    </ol>
    <p class="hint">세율·대출 규제는 자주 바뀝니다. 이 계산은 판단을 돕는 추정치이고, 최종 금액은 은행·법무사·세무사에게 확인하세요.</p>
  </div></div>`;
  return h;
}
function renderSettings(){
  const S = state.settings;
  return `<div><h2>우리 정보</h2><p class="sub">모든 계산의 기준이 되는 값이에요. 두 사람이 같은 값을 공유합니다.</p></div>
  <form class="grid panel" data-form="settings" style="margin:0">${SETTINGS_FIELDS.map(f => fieldHtml("set", f, S[f.k])).join("")}
  ${readOnly?"":`<div class="formbar"><button class="btn primary" type="submit">저장</button></div>`}</form>
  <p class="hint">기본값 안내: 스트레스 가산금리와 LTV, 절대한도는 지역(수도권·규제지역 여부)과 집값 구간에 따라 다릅니다. 상담한 은행이 알려준 값으로 바꿔 주세요.</p>`;
}

// ---------- events ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-act]"); if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; ls.set("tab", tab); render(); return; }
  const {act, coll, id} = t.dataset;
  if (act === "new"){ editing[coll] = "new"; render(); focusFirst(coll); }
  else if (act === "edit"){ editing[coll] = id; render(); focusFirst(coll); }
  else if (act === "cancel"){ editing[coll] = null; render(); }
  else if (act === "del"){
    if (confirmDel[coll] === id){ confirmDel[coll] = null; await delDoc(coll, id); render(); }
    else { confirmDel[coll] = id; render(); setTimeout(() => { if (confirmDel[coll]===id){ confirmDel[coll]=null; render(); } }, 4000); }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "pickSell"){ state.pickedSell = t.value || null; render(); }
  if (t.dataset && t.dataset.act === "toggle"){
    const rec = state.todos.find(x => x.id === t.dataset.id); if (!rec) return;
    const {id, ...rest} = rec; await saveDoc("todos", id, {...rest, done: t.checked}); render();
  }
});
function focusFirst(coll){ const f = document.querySelector(`form[data-form="${coll}"] input, form[data-form="${coll}"] select`); if (f) f.focus(); }
document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form, fd = new FormData(f);
  if (kind === "settings"){
    const s = {}; SETTINGS_FIELDS.forEach(x => s[x.k] = x.t === "chk" ? fd.has(x.k) : String(fd.get(x.k) ?? "").trim());
    await saveSettings(s); setStatus("저장됨"); render(); return;
  }
  if (kind === "todo"){
    const text = String(fd.get("text")||"").trim(); if (!text) return;
    await saveDoc("todos", newId(), {text, done:false, order: state.todos.length + 1}); render(); return;
  }
  const sch = SCHEMAS[kind], id = editing[kind] === "new" ? newId() : editing[kind];
  const rec = {}; sch.fields.forEach(x => rec[x.k] = x.t === "chk" ? fd.has(x.k) : String(fd.get(x.k) ?? "").trim());
  editing[kind] = null;
  await saveDoc(kind, id, rec); render();
});

// ---------- boot ----------
render();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  if (!db){
    shared = false;
    setStatus("이 화면에서만 계산 (공유 저장 꺼짐)");
    return;
  }
  shared = true; setStatus("실시간 공유 중");
  try {
    const u = await window.claude.use("user");
    if (u && typeof u.can === "function"){ const w = await u.can("data.write"); if (w === false){ readOnly = true; banner("보기 전용으로 열렸어요. 수정하려면 편집 권한이 필요합니다."); } }
  } catch(e){}
  ["sells","buys","loans","comps","todos"].forEach(coll => {
    db.collection(coll).onSnapshot(snap => {
      state[coll] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if (!editing[coll] || tab !== coll) render();
    }, err => { setStatus("연결이 끊겼어요. 새로고침해 주세요."); });
  });
  db.doc("plan/settings").onSnapshot(snap => {
    state.settings = snap.exists ? {...DEFAULT_SETTINGS, ...snap.data()} : {...DEFAULT_SETTINGS};
    if (tab !== "settings") render();
  }, () => {});
})();
})();
</script>
