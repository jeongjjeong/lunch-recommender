<title>우리집 갈아타기 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --sub:#4E5968; --muted:#8B95A1; --line:#E5E8EB; --field:#F2F4F6;
  --blue:#3182F6; --blue-soft:#E8F3FF; --red:#F04452; --red-soft:#FFEEEE; --green:#03A866; --green-soft:#E5F8EF;
  --orange:#F08C00; --orange-soft:#FFF4E5; --on-blue:#FFFFFF; --shadow:0 1px 2px rgba(0,27,55,.04);
  --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#101114; --card:#1C1D22; --ink:#F9FAFB; --sub:#B0B8C1; --muted:#6B7684; --line:#2C2E35; --field:#26282E;
  --blue:#4B96FA; --blue-soft:#18293F; --red:#F66570; --red-soft:#3A1E22; --green:#2DC98C; --green-soft:#13302A;
  --orange:#FFB443; --orange-soft:#3A2E17; --on-blue:#FFFFFF; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101114; --card:#1C1D22; --ink:#F9FAFB; --sub:#B0B8C1; --muted:#6B7684; --line:#2C2E35; --field:#26282E;
  --blue:#4B96FA; --blue-soft:#18293F; --red:#F66570; --red-soft:#3A1E22; --green:#2DC98C; --green-soft:#13302A;
  --orange:#FFB443; --orange-soft:#3A2E17; --on-blue:#FFFFFF; --shadow:none;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:14px 8px}
header.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
.top-r{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--green)}
.who{appearance:none;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;width:auto}
.iconbtn{border:0;background:var(--card);color:var(--sub);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card.tight{gap:8px}
.label{font-size:13px;color:var(--sub);font-weight:500}
.big{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.mid{font-size:20px;font-weight:800;letter-spacing:-.02em}
.small{font-size:13px;color:var(--muted)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:12px 4px 0}
.sec h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.02em}
.red{color:var(--red)} .green{color:var(--green)} .blue{color:var(--blue)} .orange{color:var(--orange)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--field);color:var(--sub);font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:8px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--field);border-radius:12px;padding:10px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:14px;font-weight:700;word-break:keep-all;line-height:1.35}
.rowkv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.rowkv .k{color:var(--sub)}
.rowkv .v{font-weight:700;text-align:right}
.rowkv.total{border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.rowkv.indent .k{padding-left:10px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.orange{background:var(--orange-soft);color:var(--orange)}
.badge.gray{background:var(--field);color:var(--sub)}
.cand{cursor:pointer}
.cand-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cand-name{font-size:17px;font-weight:800;letter-spacing:-.02em}
.funding{display:flex;justify-content:space-between;align-items:center;background:var(--field);border-radius:14px;padding:14px 16px}
.funding .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.bar{position:relative;height:8px;background:var(--field);border-radius:99px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue)}
.bar i.over{background:var(--red)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.details{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.note{font-size:14px;color:var(--sub);white-space:pre-line;background:var(--field);border-radius:12px;padding:12px 14px}
.actions{display:flex;gap:8px}
.btn{border:0;font:inherit;font-weight:700;font-size:15px;border-radius:14px;padding:13px 16px;cursor:pointer;background:var(--field);color:var(--ink);flex:1}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.danger{color:var(--red)}
.btn.sm{font-size:13px;padding:8px 12px;border-radius:10px;flex:none}
.add{border:1.5px dashed var(--line);background:none;color:var(--blue);font:inherit;font-weight:700;border-radius:16px;padding:14px;cursor:pointer}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700;font-size:15px}
.li .s{font-size:13px;color:var(--muted)}
.li .r{text-align:right;flex:none}
.li.click{cursor:pointer}
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin-top:1px}
.todo.done .tt{color:var(--muted);text-decoration:line-through}
.todo .tt{flex:1;font-size:15px}
.todo .by{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--sub);font-weight:500}
.field .hint{font-size:12px;color:var(--muted)}
.field .conv{font-size:12px;color:var(--blue);font-weight:700;min-height:1em}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{min-height:96px;resize:vertical}
.chkrow{display:flex;align-items:center;gap:10px;font-size:15px}
.chkrow input{width:22px;height:22px;accent-color:var(--blue)}
button:focus-visible,.cand:focus-visible,.li.click:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{background:var(--orange-soft);color:var(--orange);border-radius:14px;padding:12px 16px;font-size:14px;font-weight:500}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabbar button{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:700;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button[aria-selected="true"]{color:var(--ink)}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:88%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.sheet .grip{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px 0}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<div class="app">
  <header class="top">
    <h1>우리집 갈아타기</h1>
    <div class="top-r">
      <span class="dot" id="dot" title="공유 상태"></span>
      <select class="who" id="who" aria-label="입력하는 사람"><option>경한</option><option>정현</option></select>
      <button class="iconbtn" id="gear" aria-label="우리 정보 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="main" class="app" style="gap:12px"></main>
</div>

<nav class="tabbar"><div class="in" role="tablist">
  <button role="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>한눈에</button>
  <button role="tab" data-tab="homes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>매물</button>
  <button role="tab" data-tab="loans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9 12 4l9 5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>대출</button>
  <button role="tab" data-tab="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>시세</button>
  <button role="tab" data-tab="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>할 일</button>
</div></nav>
<div id="sheet"></div>

<script>
(function(){
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => { const x = parseFloat(String(v ?? "").replace(/,/g,"")); return isFinite(x) ? x : 0; };
const has = v => v !== undefined && v !== null && String(v).trim() !== "";
function won(m, unit=true){ // 만원 → "12억 4,000만원"
  if (!isFinite(m)) return "-";
  const neg = m < 0; m = Math.round(Math.abs(m));
  const eok = Math.floor(m/10000), man = m%10000;
  let s = eok ? eok.toLocaleString()+"억" + (man ? " "+man.toLocaleString()+"만" : "") : man.toLocaleString()+"만";
  if (m === 0) s = "0";
  return (neg ? "−" : "") + s + (unit ? "원" : "");
}
const eok = m => (Math.round(m/100)/100).toLocaleString(undefined,{maximumFractionDigits:2}) + "억";
const pct = (x,d=1) => (isFinite(x) ? x.toFixed(d) : "-") + "%";
const ls = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

// ---------- 세금·수수료 (추정, 확인 필요) ----------
function brokerCap(price){
  if (price < 5000) return {rate:0.6, max:25};
  if (price < 20000) return {rate:0.5, max:80};
  if (price < 90000) return {rate:0.4};
  if (price < 120000) return {rate:0.5};
  if (price < 150000) return {rate:0.6};
  return {rate:0.7};
}
function brokerFee(price, rateOverride, vat){
  const cap = brokerCap(price);
  const rate = has(rateOverride) ? n(rateOverride) : cap.rate;
  let fee = price * rate / 100;
  if (!has(rateOverride) && cap.max) fee = Math.min(fee, cap.max);
  if (vat) fee *= 1.1;
  return {fee, rate, capRate:cap.rate};
}
function acqTax(price, over85){ // 1주택(일시적 2주택 포함)
  const e = price/10000;
  let r = e <= 6 ? 1 : e <= 9 ? e*2/3 - 3 : 3;
  r = Math.round(r*100)/100;
  const total = r + r*0.1 + (over85 ? 0.2 : 0);
  return {rate:r, total, amount: price*total/100};
}
function payment(P, ratePct, years){
  const r = ratePct/100/12, N = Math.max(1, Math.round(years*12));
  if (P <= 0) return 0;
  return r === 0 ? P/N : P*r/(1-Math.pow(1+r,-N));
}
function interestPaid(P, ratePct, years, months){
  const r = ratePct/100/12, M = payment(P, ratePct, years), k = Math.min(months, Math.round(years*12));
  if (P <= 0 || r === 0) return 0;
  const g = Math.pow(1+r,k);
  return M*k - (P - (P*g - M*(g-1)/r));
}

// ---------- 입력 항목 ----------
const SCHEMAS = {
  sells: { title:"팔 가격", fields:[
    {k:"label", l:"이름", t:"text", req:true, ph:"예: 현재 호가, A부동산 제안"},
    {k:"price", l:"매도가", t:"won", req:true},
    {k:"brokerRate", l:"복비 요율 %", t:"num", hint:"비우면 법정 상한으로 계산"},
    {k:"cgt", l:"양도세", t:"won", hint:"1세대1주택 비과세면 0"},
    {k:"extra", l:"기타 비용", t:"won", hint:"근저당 말소 등"},
    {k:"note", l:"메모", t:"area"} ]},
  buys: { title:"살 집", fields:[
    {k:"label", l:"이름", t:"text", req:true, ph:"예: 한솔4단지 409동 17평 9층"},
    {k:"price", l:"매수가", t:"won", req:true},
    {k:"kb", l:"KB시세 (일반가)", t:"won", hint:"주담대 한도 = KB시세 × LTV − 방공제"},
    {k:"interior", l:"인테리어", t:"won"},
    {k:"moving", l:"이사·청소", t:"won"},
    {k:"legal", l:"등기·법무사·채권·선수관리비", t:"won", hint:"비우면 매수가의 0.15%로 추정"},
    {k:"brokerRate", l:"복비 요율 %", t:"num", hint:"비우면 법정 상한으로 계산"},
    {k:"over85", l:"전용 85㎡ 초과", t:"chk"},
    {k:"note", l:"특징·메모", t:"area"} ]},
  loans: { title:"대출", fields:[
    {k:"kind", l:"종류", t:"sel", opts:["주담대","신용·기타"]},
    {k:"bank", l:"은행·상품", t:"text", req:true},
    {k:"type", l:"금리 방식", t:"sel", opts:["혼합형(5년 고정)","주기형","고정형","변동형"]},
    {k:"rate", l:"기본 금리 %", t:"num", req:true},
    {k:"discount", l:"우대금리 %p", t:"num"},
    {k:"conditions", l:"우대 조건·특약", t:"text", ph:"급여이체, 카드 월 30만 등"},
    {k:"condCost", l:"우대 조건 유지비용 (월)", t:"won"},
    {k:"max", l:"은행 제시 한도", t:"won", hint:"비우면 KB시세 기준 자동 계산"},
    {k:"years", l:"기간 (년)", t:"num"},
    {k:"prepay", l:"중도상환수수료 %", t:"num"},
    {k:"note", l:"메모", t:"area"} ]},
  comps: { title:"시세", fields:[
    {k:"side", l:"구분", t:"sel", opts:["매수 후보","우리집(매도)"]},
    {k:"kind", l:"종류", t:"sel", opts:["KB시세","실거래가","호가","급매"]},
    {k:"complex", l:"단지·동", t:"text", req:true},
    {k:"area", l:"평형", t:"text", ph:"17평"},
    {k:"floor", l:"층", t:"text"},
    {k:"price", l:"가격", t:"won", req:true},
    {k:"date", l:"날짜", t:"text", ph:"2026-09-18"},
    {k:"note", l:"메모", t:"text"} ]},
};
const SETTINGS_FIELDS = [
  {k:"cash", l:"보유 자산 (현금·주식 등)", t:"won"},
  {k:"payoff", l:"지금 집 대출 잔액", t:"won"},
  {k:"payoffFee", l:"지금 대출 중도상환수수료", t:"won"},
  {k:"income", l:"부부 합산 연소득", t:"won", hint:"DSR 계산용"},
  {k:"otherDebt", l:"다른 대출 연 원리금", t:"won"},
  {k:"ltv", l:"LTV %", t:"num"},
  {k:"roomDeduct", l:"방공제", t:"won", hint:"경기 과밀억제권역 4,800만"},
  {k:"cap", l:"주담대 상한", t:"won"},
  {k:"stress", l:"스트레스 가산금리 %p", t:"num", hint:"은행 확인"},
  {k:"dsrLimit", l:"DSR 한도 %", t:"num"},
  {k:"qInterior", l:"기본 인테리어 (빠른 계산용)", t:"won"},
  {k:"qMoving", l:"기본 이사·청소 (빠른 계산용)", t:"won"},
  {k:"qLegal", l:"기본 등기 등 (빠른 계산용)", t:"won"},
  {k:"horizon", l:"이자 비교 기간 (년)", t:"num"},
  {k:"vat", l:"복비에 부가세 10% 포함", t:"chk"},
];
const DEFAULT_SETTINGS = {cash:"", payoff:"", payoffFee:"", income:"", otherDebt:"", stress:"1.5", dsrLimit:"40", ltv:"40", cap:"60000", roomDeduct:"", horizon:"5", vat:true, qInterior:"3000", qMoving:"255", qLegal:"487"};

// ---------- 상태·저장 ----------

async function saveDoc(coll, id, data){

function handleErr(e){
  if (e && e.code === "invalid_argument"){ readOnly = true; banner("보기 전용으로 열렸어요. 수정하려면 '편집 가능' 권한이 필요해요."); render(); return; }
  if (e && e.code === "quota_exceeded"){ banner("저장 공간이 가득 찼어요. 오래된 시세 기록을 지워 주세요."); return; }
  banner("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

// ---------- 계산 ----------
const S = () => state.settings;
function sellCalc(s){
  const price = n(s.price), b = brokerFee(price, s.brokerRate, !!S().vat);
  const cgt = n(s.cgt), extra = n(s.extra), payoff = n(S().payoff) + n(S().payoffFee);
  return {price, broker:b, cgt, extra, payoff, net: price - b.fee - cgt - extra - payoff};
}
function buyCalc(b){
  const price = n(b.price), tax = acqTax(price, !!b.over85), br = brokerFee(price, b.brokerRate, !!S().vat);
  const legal = has(b.legal) ? n(b.legal) : price*0.0015, interior = n(b.interior), moving = n(b.moving);
  const extras = tax.amount + br.fee + legal + interior + moving;
  return {price, tax, broker:br, legal, interior, moving, extras, total: price + extras};
}
const isSub = l => l.kind === "신용·기타";
function mainLimit(loan, kb){
  const lim = [Math.max(0, kb * (has(S().ltv) ? n(S().ltv) : 40)/100 - n(S().roomDeduct))];
  if (has(S().cap)) lim.push(n(S().cap));
  if (loan && has(loan.max)) lim.push(n(loan.max));
  return Math.min(...lim);
}
function loanCost(loan, amt){
  const rate = n(loan.rate) - n(loan.discount), years = n(loan.years) || (isSub(loan) ? 5 : 30);
  const H = Math.max(1, n(S().horizon) || 5);
  return {rate, years, amt, monthly: payment(amt, rate, years),
    stressMonthly: payment(amt, rate + (isSub(loan) ? 0 : n(S().stress)), years),
    cost: interestPaid(amt, rate, years, H*12) + (amt > 0 ? n(loan.condCost)*12*H : 0)};
}
function financing(need, kb){
  const empty = {need, parts:[], short:0, cost:0, monthly:0, dsr:NaN, dsrOk:true, limit: mainLimit(null, kb)};
  if (need <= 0) return empty;
  const mains = state.loans.filter(l => !isSub(l)), subs = state.loans.filter(isSub);
  const plans = [];
  const tryMain = m => {
    const limit = mainLimit(m, kb), mainAmt = Math.min(need, limit), rest = need - mainAmt;
    const parts = m && mainAmt > 0 ? [{loan:m, c:loanCost(m, mainAmt)}] : [];
    let short = rest > 0.5 ? rest : 0;
    if (short){
      const fits = subs.filter(x => !has(x.max) || n(x.max) >= short - 0.5).map(x => ({loan:x, c:loanCost(x, short)})).sort((a,b) => a.c.cost - b.c.cost);
      if (fits[0]){ parts.push(fits[0]); short = 0; }
    }
    plans.push({need, parts, short, limit, mainAmt: m ? mainAmt : 0});
  };
  if (mains.length) mains.forEach(tryMain); else tryMain(null);
  const inc = n(S().income);
  plans.forEach(p => {
    p.cost = p.parts.reduce((a,x) => a + x.c.cost, 0);
    p.monthly = p.parts.reduce((a,x) => a + x.c.monthly, 0);
    p.dsr = inc > 0 ? (p.parts.reduce((a,x) => a + x.c.stressMonthly, 0)*12 + n(S().otherDebt)) / inc * 100 : NaN;
    p.dsrOk = !isFinite(p.dsr) || p.dsr <= (n(S().dsrLimit) || 40);
  });
  plans.sort((a,b) => a.short - b.short || (b.dsrOk - a.dsrOk) || a.cost - b.cost);
  return plans[0];
}
function currentSell(){
  if (!state.sells.length) return null;
  return state.sells.find(s => s.id === pickedSell) || [...state.sells].sort((a,b) => n(b.price) - n(a.price))[0];
}
function evalBuy(b){
  const sell = currentSell(), sellNet = sell ? sellCalc(sell).net : 0;
  const bc = buyCalc(b), need = bc.total - sellNet - n(S().cash);
  const kb = has(b.kb) ? n(b.kb) : bc.price;
  return {buy:b, bc, need, kb, plan: financing(need, kb)};
}
function ranked(){
  return state.buys.map(evalBuy).sort((a,b) => a.plan.short - b.plan.short || (b.plan.dsrOk - a.plan.dsrOk) || (a.bc.extras + a.plan.cost) - (b.bc.extras + b.plan.cost));
}
function quickEval(priceMan, kbMan){
  return evalBuy({price: priceMan, kb: kbMan, interior:S().qInterior, moving:S().qMoving, legal:S().qLegal});
}
function maxPriceNoExtra(kbMan){ // 추가 조달 없이 살 수 있는 최대 매수가
  let lo = 0, hi = 400000;
  for (let i=0;i<40;i++){ const mid=(lo+hi)/2; if (quickEval(mid, kbMan).plan.short > 0.5) hi = mid; else lo = mid; }
  return Math.floor(lo/100)*100;
}

// ---------- 화면 조각 ----------
function fundingBlock(plan){
  if (plan.need <= 0) return `<div class="funding"><span class="label">대출 없이 가능</span><span class="v green">${won(-plan.need)} 남음</span></div>`;
  if (plan.short > 0) return `<div class="funding"><span class="label">주담대 후 더 필요한 돈</span><span class="v red">${won(plan.short)}</span></div>`;
  return `<div class="funding"><span class="label">주담대만으로 가능</span><span class="v green">추가 0원</span></div>`;
}
function dsrBlock(plan){
  if (plan.need <= 0 || !isFinite(plan.dsr)) return "";
  const lim = n(S().dsrLimit) || 40, over = plan.dsr > lim;
  return `<div class="tight" style="display:flex;flex-direction:column;gap:6px">
    <div class="rowkv"><span class="k">DSR <span class="small">스트레스 +${esc(S().stress||0)}%p</span></span><span class="v ${over?"red":""}">${pct(plan.dsr)} <span class="small">/ 한도 ${lim}%</span></span></div>
    <div class="bar"><i class="${over?"over":""}" style="width:${Math.min(100, plan.dsr/60*100)}%"></i><b style="left:${lim/60*100}%"></b></div></div>`;
}
function statsBlock(x){
  const p = x.plan, main = p.parts.find(q => !isSub(q.loan));
  return `<div class="stats">
    <div class="stat"><div class="k">주담대</div><div class="v">${won(main ? main.c.amt : Math.min(Math.max(x.need,0), p.limit), false)}</div></div>
    <div class="stat"><div class="k">월 상환</div><div class="v">${p.monthly ? won(p.monthly, false) : "-"}</div></div>
    <div class="stat"><div class="k">부대비용</div><div class="v">${won(x.bc.extras, false)}</div></div></div>`;
}
function candCard(x, i){
  const b = x.buy, isOpen = open.has(b.id), p = x.plan;
  const tag = i === 0 ? `<span class="badge blue">가장 부담 적음</span>` : !p.dsrOk ? `<span class="badge red">DSR 초과</span>` : "";
  let h = `<div class="card cand" tabindex="0" data-act="toggle" data-id="${esc(b.id)}">
    <div class="cand-head"><div><div class="cand-name">${esc(b.label)}</div>
      <div class="small">매수 ${eok(x.bc.price)} · KB ${has(b.kb) ? eok(n(b.kb)) : "미입력"}</div></div>${tag}</div>
    ${fundingBlock(p)}${statsBlock(x)}${dsrBlock(p)}`;
  if (isOpen){
    const sell = currentSell(), sc = sell ? sellCalc(sell) : null;
    h += `<div class="details">
      <div class="rowkv"><span class="k">팔고 남는 돈</span><span class="v">${sc ? won(sc.net) : "-"}</span></div>
      <div class="rowkv"><span class="k">+ 보유 자산</span><span class="v">${won(n(S().cash))}</span></div>
      <div class="rowkv"><span class="k">− 매수가</span><span class="v">${won(x.bc.price)}</span></div>
      <div class="rowkv"><span class="k">− 취득세 ${pct(x.bc.tax.total,2)}</span><span class="v">${won(x.bc.tax.amount)}</span></div>
      <div class="rowkv"><span class="k">− 복비 ${pct(x.bc.broker.rate,1)}${S().vat?"+VAT":""}</span><span class="v">${won(x.bc.broker.fee)}</span></div>
      <div class="rowkv"><span class="k">− 등기·채권 등</span><span class="v">${won(x.bc.legal)}</span></div>
      <div class="rowkv"><span class="k">− 인테리어</span><span class="v">${won(x.bc.interior)}</span></div>
      <div class="rowkv"><span class="k">− 이사·청소</span><span class="v">${won(x.bc.moving)}</span></div>
      <div class="rowkv total"><span class="k">빌려야 하는 돈</span><span class="v">${won(Math.max(0,x.need))}</span></div>
      <div class="rowkv indent"><span class="k">주담대 한도 (KB ${eok(x.kb)} × ${esc(S().ltv)}% − ${won(n(S().roomDeduct),false)})</span><span class="v">${won(p.limit)}</span></div>
      ${p.parts.map(q => `<div class="rowkv indent"><span class="k">${esc(q.loan.bank)} ${pct(q.c.rate,2)} · ${q.c.years}년</span><span class="v">${won(q.c.amt)}</span></div>`).join("")}
      ${p.short ? `<div class="rowkv indent"><span class="k">추가 조달 (할 일 탭에서 계획)</span><span class="v red">${won(p.short)}</span></div>` : ""}
      ${b.note ? `<div class="note">${esc(b.note)}</div>` : ""}
      ${readOnly ? "" : `<div class="actions"><button class="btn sm" data-act="edit" data-coll="buys" data-id="${esc(b.id)}">수정</button></div>`}
    </div>`;
  } else {
    h += `<div class="small" style="text-align:center">눌러서 자세히 보기</div>`;
  }
  return h + `</div>`;
}

function quickCard(){

}
function quickOut(){
  const kb = n(quick.kb) || 0, priceEok = n(quick.price);
  if (!kb) return `<div class="empty">시세 탭에 KB시세를 추가하면 고를 수 있어요</div>`;

}

function renderMarket(){
  let h = `<div class="seg" role="group"><button data-act="marketSeg" data-v="매수 후보" aria-pressed="${marketSeg==="매수 후보"}">살 곳</button><button data-act="marketSeg" data-v="우리집(매도)" aria-pressed="${marketSeg==="우리집(매도)"}">우리집</button></div>`;
  const rows = state.comps.filter(c => (c.side||"우리집(매도)") === marketSeg);
  const groups = {};
  rows.forEach(r => { const k = `${String(r.complex).replace(/\s*\d+동.*$/,"")} ${r.area||""}`.trim(); (groups[k] = groups[k] || []).push(r); });
  const keys = Object.keys(groups).sort();
  if (!keys.length) h += `<div class="card"><div class="empty">기록이 없어요</div></div>`;
  keys.forEach(k => {
    const g = groups[k].sort((a,b) => String(b.date).localeCompare(String(a.date)));
    const kb = g.find(r => r.kind === "KB시세"), real = g.filter(r => r.kind === "실거래가"), asks = g.filter(r => r.kind === "호가" || r.kind === "급매");
    const lastReal = real[0];
    h += `<div class="card tight"><div class="cand-name">${esc(k)}</div>
      <div class="stats"><div class="stat"><div class="k">KB시세</div><div class="v">${kb ? eok(n(kb.price)) : "-"}</div></div>
      <div class="stat"><div class="k">최근 실거래</div><div class="v">${lastReal ? eok(n(lastReal.price)) : "-"}</div></div>
      <div class="stat"><div class="k">최저 호가</div><div class="v">${asks.length ? eok(Math.min(...asks.map(a => n(a.price)))) : "-"}</div></div></div>
      <div class="list">${g.map(r => `<div class="li click" tabindex="0" data-act="edit" data-coll="comps" data-id="${esc(r.id)}"><div><div class="t"><span class="badge ${r.kind==="KB시세"?"blue":r.kind==="실거래가"?"gray":r.kind==="급매"?"red":"orange"}">${esc(r.kind)}</span> ${esc(r.floor||"")}</div><div class="s">${esc(r.date||"")}${r.note?" · "+esc(r.note):""}</div></div><div class="r t">${eok(n(r.price))}</div></div>`).join("")}</div></div>`;
  });
  if (!readOnly) h += `<button class="add" data-act="new" data-coll="comps">+ 시세 추가</button>`;
  return h;
}
function renderTodo(){
  const todos = state.todos.slice().sort((a,b) => (n(a.order)-n(b.order)) || String(a.at).localeCompare(String(b.at)));
  const done = todos.filter(t => t.done).length;
  return `<div class="card tight"><div class="cand-head"><div class="mid">같이 챙길 일</div><span class="badge blue">${done}/${todos.length}</span></div>
    <div>${todos.map(t => `<div class="todo ${t.done?"done":""}"><input type="checkbox" aria-label="완료" data-act="check" data-id="${esc(t.id)}" ${t.done?"checked":""} ${readOnly?"disabled":""}><div class="tt">${esc(t.text)}${t.by && t.by!=="Claude" ? `<div class="by">${esc(t.by)}</div>` : ""}</div>${readOnly?"":`<button class="btn sm danger" data-act="delTodo" data-id="${esc(t.id)}" aria-label="삭제">삭제</button>`}</div>`).join("")}</div>
    ${readOnly?"":`<form id="todo-form" style="display:flex;gap:8px;margin-top:4px"><input id="todo-text" placeholder="할 일 추가" required><button class="btn primary" style="flex:none" type="submit">추가</button></form>`}
  </div>`;
}

// ---------- 시트(입력 폼) ----------
function fieldHtml(f, v){
  const id = "f-"+f.k, hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : "";
  if (f.t === "chk") return `<label class="chkrow" for="${id}"><input type="checkbox" id="${id}" name="${f.k}" ${v?"checked":""}>${esc(f.l)}</label>`;
  if (f.t === "area") return `<label class="field" for="${id}"><span>${esc(f.l)}</span><textarea id="${id}" name="${f.k}">${esc(v)}</textarea></label>`;
  if (f.t === "sel") return `<label class="field" for="${id}"><span>${esc(f.l)}</span><select id="${id}" name="${f.k}">${f.opts.map(o => `<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>${hint}</label>`;
  const conv = f.t === "won" ? `<span class="conv" data-conv="${id}">${has(v) ? won(n(v)) : ""}</span>` : "";
  return `<label class="field" for="${id}"><span>${esc(f.l)}${f.t==="won"?" <span class='hint'>(만원)</span>":""}</span><input id="${id}" name="${f.k}" ${f.t!=="text"?'inputmode="decimal"':""} ${f.req?"required":""} placeholder="${esc(f.ph||"")}" value="${esc(v)}">${conv}${hint}</label>`;
}
function renderSheet(){
  const el = $("#sheet");
  if (!sheet){ el.innerHTML = ""; return; }
  let title, fields, rec, canDel = false;
  if (sheet.kind === "settings"){ title = "우리 정보"; fields = SETTINGS_FIELDS; rec = state.settings; }
  else { const sch = SCHEMAS[sheet.coll]; fields = sch.fields; rec = sheet.id ? (state[sheet.coll].find(r => r.id === sheet.id) || {}) : {}; title = (sheet.id ? "" : "새 ") + sch.title + (sheet.id ? " 수정" : ""); canDel = !!sheet.id; }
  el.innerHTML = `<div class="sheet-bg" data-act="closeBg"><form class="sheet" id="sheet-form" role="dialog" aria-label="${esc(title)}">
    <div class="grip"></div><h3>${esc(title)}</h3>
    ${fields.map(f => fieldHtml(f, rec[f.k])).join("")}
    ${readOnly ? "" : `<button class="btn primary" type="submit">저장</button>`}
    <div class="actions"><button class="btn" type="button" data-act="close">닫기</button>${canDel && !readOnly ? `<button class="btn danger" type="button" data-act="del">${delArm ? "한 번 더 누르면 삭제" : "삭제"}</button>` : ""}</div>
  </form></div>`;
}
function openSheet(s){ sheet = s; delArm = false; renderSheet(); const f = $("#sheet-form input, #sheet-form select"); if (f && !s.id) f.focus(); }
function closeSheet(){ sheet = null; renderSheet(); }

// ---------- 렌더 ----------
function render(){
  document.querySelectorAll("nav.tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  const a = document.activeElement, keep = a && a.id && $("#main").contains(a) ? {id:a.id, s:a.selectionStart, e:a.selectionEnd} : null;
  const R = {home:renderHome, homes:renderHomes, loans:renderLoans, market:renderMarket, todo:renderTodo};
  $("#main").innerHTML = R[tab]();
  if (keep){ const el = document.getElementById(keep.id); if (el){ el.focus(); try{ el.setSelectionRange(keep.s, keep.e); }catch(e){} } }
}

// ---------- 이벤트 ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-act],#gear"); if (!t) return;
  if (t.id === "gear"){ openSheet({kind:"settings"}); return; }
  if (t.dataset.tab){ tab = t.dataset.tab; ls.set("tab2", tab); render(); window.scrollTo(0,0); return; }
  const {act, coll, id} = t.dataset;
  if (act === "closeBg" && e.target === t) closeSheet();
  else if (act === "close") closeSheet();
  else if (act === "pickSell"){ pickedSell = id; ls.set("pickedSell", id); render(); }
  else if (act === "toggle"){ if (e.target.closest("button")) return; open.has(id) ? open.delete(id) : open.add(id); render(); }
  else if (act === "new") openSheet({coll});
  else if (act === "edit"){ e.stopPropagation(); openSheet({coll, id}); }
  else if (act === "homesSeg"){ homesSeg = t.dataset.v; render(); }
  else if (act === "marketSeg"){ marketSeg = t.dataset.v; render(); }
  else if (act === "del"){
    if (!delArm){ delArm = true; renderSheet(); return; }
    const {coll:c, id:i} = sheet; closeSheet(); await delDoc(c, i);
  }
  else if (act === "delTodo"){ await delDoc("todos", id); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheet) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".cand,.li.click")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "check"){
    const rec = state.todos.find(x => x.id === t.dataset.id); if (!rec) return;
    const {id, ...rest} = rec; await saveDoc("todos", id, {...rest, done: t.checked});
  }
  if (t.id === "q-kb"){ quick.kb = t.value; ls.set("quickKb", t.value); $("#q-out").innerHTML = quickOut(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q-price"){ quick.price = t.value; $("#q-out").innerHTML = quickOut(); }
  const conv = document.querySelector(`[data-conv="${t.id}"]`);
  if (conv) conv.textContent = has(t.value) ? won(n(t.value)) : "";
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "todo-form"){
    const inp = $("#todo-text"), text = inp.value.trim(); if (!text) return;
    inp.value = ""; await saveDoc("todos", newId(), {text, done:false, order: state.todos.length + 1}); return;
  }
  if (e.target.id !== "sheet-form" || !sheet) return;
  const fd = new FormData(e.target);
  if (sheet.kind === "settings"){
    const s = {...state.settings}; SETTINGS_FIELDS.forEach(x => s[x.k] = x.t === "chk" ? fd.has(x.k) : String(fd.get(x.k) ?? "").trim());
    closeSheet(); await saveSettings(s); return;
  }
  const {coll} = sheet, id = sheet.id || newId(), prev = sheet.id ? (state[coll].find(r => r.id === sheet.id) || {}) : {};
  const rec = {}; Object.keys(prev).forEach(k => { if (k !== "id") rec[k] = prev[k]; });
  SCHEMAS[coll].fields.forEach(x => rec[x.k] = x.t === "chk" ? fd.has(x.k) : String(fd.get(x.k) ?? "").trim());
  closeSheet(); await saveDoc(coll, id, rec);
});

// ---------- 시작 ----------
render();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  if (!db){ $("#dot").title = "이 화면에서만 계산 (공유 저장 꺼짐)"; return; }
  shared = true; $("#dot").classList.add("on"); $("#dot").title = "실시간 공유 중";
  try {
    const u = await window.claude.use("user");
    if (u && typeof u.can === "function" && (await u.can("data.write")) === false){ readOnly = true; banner("보기 전용으로 열렸어요. 수정하려면 '편집 가능' 권한이 필요해요."); }
  } catch(e){}
  ["sells","buys","loans","comps","todos"].forEach(coll => {
    db.collection(coll).onSnapshot(snap => {
      state[coll] = snap.docs.map(d => ({id:d.id, ...d.data()}));
      render();
    }, () => { $("#dot").classList.remove("on"); banner("연결이 끊겼어요. 새로고침해 주세요."); });
  });
  db.doc("plan/settings").onSnapshot(snap => {
    state.settings = snap.exists ? {...DEFAULT_SETTINGS, ...snap.data()} : {...DEFAULT_SETTINGS};
    render();
  }, () => {});
})();
})();
</script>
