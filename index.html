<title>보글보글 너구리</title>
<meta name="theme-color" content="#08040f">
<meta name="description" content="너구리가 납치된 보글이를 구하러 10개의 성을 넘는 픽셀아트 아케이드 게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보글보글">
<style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        margin: 0;
        background: #08040f;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
    }

    /* 1080x1920 과 같은 9:16 비율. 화면을 꽉 채운다 */
    #stage {
        position: relative;
        width: min(100vw, calc(100dvh * 9 / 16));
        max-height: 100dvh;
        aspect-ratio: 9 / 16;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
    }

    /* 버튼 그림은 캔버스에 도트로 그리고, 여기 버튼들은 투명한 터치 영역이다 */
    #touchpad, #gamepad { position: absolute; inset: 0; pointer-events: none; }

    #touchpad button {
        position: absolute;
        pointer-events: auto;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: transparent;
        font-size: 0;
        touch-action: none;
        cursor: pointer;
    }

    #touchpad button:focus-visible { outline: 2px solid #ffe14d; }

    #btnLeft  { left: 2.08%;  top: 77.34%; width: 22.22%; height: 12.5%; }
    #btnRight { left: 26.39%; top: 77.34%; width: 22.22%; height: 12.5%; }
    #btnShoot { left: 50.69%; top: 77.34%; width: 22.22%; height: 12.5%; }
    #btnJump  { left: 75%;    top: 77.34%; width: 22.22%; height: 12.5%; }
    #btnMute  { left: 86.8%;  top: 66.8%;  width: 9.7%;   height: 5.5%; }
</style>
</head>
<body>

<div id="stage">
    <canvas id="game" width="288" height="512"></canvas>
    <div id="touchpad">
        <div id="gamepad">
            <button id="btnLeft" aria-label="왼쪽으로 이동">왼쪽</button>
            <button id="btnRight" aria-label="오른쪽으로 이동">오른쪽</button>
            <button id="btnShoot" aria-label="버블 발사">버블</button>
            <button id="btnJump" aria-label="점프">점프</button>
        </div>
        <button id="btnMute" aria-label="음악 켜기 끄기">음악</button>
    </div>

        const h = rows.length, w = rows[0].length;

        const c = cv.getContext('2d');
        for (let r = 0; r < h; r++) {
            for (let x = 0; x < w; x++) {
                const col = pal[rows[r][x]];
                if (col) { c.fillStyle = col; c.fillRect(x, r, 1, 1); }
            }
        }
        const fv = document.createElement('canvas');
        fv.width = w; fv.height = h;
        const f = fv.getContext('2d');
        f.imageSmoothingEnabled = false;
        f.translate(w, 0); f.scale(-1, 1);
        f.drawImage(cv, 0, 0);
        return { n: cv, f: fv, w: w, h: h };
    }

    const glyphCache = {};

    function glyph(ch) {
        if (glyphCache[ch]) return glyphCache[ch];
        const def = FONT[ch] || FONT[' '];
        glyphCache[ch] = def.split(',');
        return glyphCache[ch];
    }

    function textWidth(str, scale) {
        return str.length * 6 * (scale || 1) - (scale || 1);
    }

    function drawText(str, x, y, color, scale) {
        const s = scale || 1;
        ctx.fillStyle = color;
        let px = Math.round(x);
        const py = Math.round(y);
        for (const ch of str.toUpperCase()) {
            const rows = glyph(ch);
            for (let r = 0; r < 7; r++) {
                const row = rows[r];
                for (let c = 0; c < 5; c++) {
                    if (row[c] === '1') ctx.fillRect(px + c * s, py + r * s, s, s);
                }
            }
            px += 6 * s;
        }
    }

    function drawTextCenter(str, cx, y, color, scale) {
        drawText(str, Math.round(cx - textWidth(str, scale) / 2), y, color, scale);
    }

    // 한글은 작게 그린 뒤 2배로 확대해 도트 느낌을 살린다
    const koCache = {};

    function koText(text, size, color) {
        const key = text + '|' + size + '|' + color;
        if (koCache[key]) return koCache[key];

        const measure = document.createElement('canvas').getContext('2d');
        const font = 'bold ' + size + 'px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
        measure.font = font;
        const w = Math.ceil(measure.measureText(text).width) + 2;
        const h = size + 6;

        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const c = cv.getContext('2d');
        c.font = font;
        c.textBaseline = 'top';
        c.fillStyle = color;
        c.fillText(text, 1, 2);

        const img = c.getImageData(0, 0, w, h);
        for (let i = 3; i < img.data.length; i += 4) {
            img.data[i] = img.data[i] > 110 ? 255 : 0;
        }
        c.putImageData(img, 0, 0);

        koCache[key] = { cv: cv, w: w, h: h };
        return koCache[key];
    }

    function drawKoAt(text, size, color, x, y) {
        if (!text) return;
        const t = koText(text, size, color);
        ctx.drawImage(t.cv, Math.round(x), Math.round(y), t.w * 2, t.h * 2);
    }

    function drawKo(text, size, color, cx, y) {
        const t = koText(text, size, color);
        ctx.drawImage(t.cv, Math.round(cx - t.w), Math.round(y), t.w * 2, t.h * 2);
    }

    /* ------------------------- 상태 ------------------------- */

    /* ------------------------- 사운드 ------------------------- */
    let actx = null;

    function audioOn() {
        if (actx) {
            if (actx.state === 'suspended') actx.resume();
            startBGM();
            return;
        }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { actx = new AC(); startBGM(); }
    }

    function beep(freq, dur, type, vol) {
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type || 'square';
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(vol || 0.05, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
        osc.connect(gain).connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + dur);
    }

    function jingle(notes) {
        notes.forEach(function (n, i) {
            setTimeout(function () { beep(n, 0.12, 'square', 0.05); }, i * 90);
        });
    }

    /* ------------------------- 8비트 배경음악 ------------------------- */
    const SCALE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };

    function hz(name) {
        if (name === '-') return 0;
        const m = /^([A-G]#?)(\d)$/.exec(name);
        const n = SCALE[m[1]] + (parseInt(m[2], 10) + 1) * 12;
        return 440 * Math.pow(2, (n - 69) / 12);
    }

    // C - Am - F - G 네 마디를 8분음표 32스텝으로. A 절과 B 절을 번갈아 돈다
    const THEME = {
        tempo: 140,
        leadA: [
            'C5', 'E5', 'G5', 'E5', 'G5', 'E5', 'C5', '-',
            'A4', 'C5', 'E5', 'C5', 'E5', 'C5', 'A4', '-',
            'F4', 'A4', 'C5', 'A4', 'C5', 'A4', 'F4', '-',
            'G4', 'B4', 'D5', 'B4', 'D5', 'G5', 'B5', '-'
        ],
        leadB: [
            'E5', 'G5', 'C6', '-', 'B5', 'G5', 'E5', '-',
            'C5', 'E5', 'A5', '-', 'G5', 'E5', 'C5', '-',
            'A4', 'C5', 'F5', '-', 'E5', 'C5', 'A4', '-',
            'B4', 'D5', 'G5', 'B5', 'D6', '-', 'B5', 'G5'
        ],
        bass: [
            'C3', '-', 'C3', '-', 'G2', '-', 'C3', '-',
            'A2', '-', 'A2', '-', 'E2', '-', 'A2', '-',
            'F2', '-', 'F2', '-', 'C3', '-', 'F2', '-',
            'G2', '-', 'G2', '-', 'D3', '-', 'G2', 'D3'
        ],
        drum: [
            1, 2, 3, 2, 1, 2, 3, 2,
            1, 2, 3, 2, 1, 2, 3, 2,
            1, 2, 3, 2, 1, 2, 3, 2,
            1, 2, 3, 2, 1, 3, 3, 3
        ]
    };

    let bgmOn = true, bgmGain = null, bgmStep = 0, bgmNext = 0, bgmTimer = null, noiseBuf = null;

    function startBGM() {
        if (!actx || bgmTimer) return;
        bgmGain = actx.createGain();
        bgmGain.gain.value = 0.16;
        bgmGain.connect(actx.destination);
        bgmNext = actx.currentTime + 0.12;
        bgmTimer = setInterval(bgmTick, 25);
    }

    function bgmTick() {
        if (!actx || actx.state !== 'running') return;
        const stepDur = 60 / THEME.tempo / 2;
        while (bgmNext < actx.currentTime + 0.25) {
            if (bgmOn) playStep(bgmStep % 64, bgmNext, stepDur);
            bgmNext += stepDur;
            bgmStep++;
        }
    }

    function playStep(i, at, dur) {
        const s = i % 32;
        tone(hz(i < 32 ? THEME.leadA[s] : THEME.leadB[s]), at, dur * 0.85, 'square', 0.1);
        tone(hz(THEME.bass[s]), at, dur * 1.6, 'triangle', 0.22);

        const d = THEME.drum[s];
        if (d === 1) kick(at);
        else if (d === 2) noise(at, 0.03, 0.05);
        else if (d === 3) noise(at, 0.09, 0.12);
    }

    function tone(f, at, dur, type, vol) {
        if (!f || !bgmGain) return;
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, at);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(g).connect(bgmGain);
        osc.start(at);
        osc.stop(at + dur + 0.03);
    }

    function kick(at) {
        if (!bgmGain) return;
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, at);
        osc.frequency.exponentialRampToValueAtTime(48, at + 0.11);
        g.gain.setValueAtTime(0.3, at);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.13);
        osc.connect(g).connect(bgmGain);
        osc.start(at);
        osc.stop(at + 0.15);
    }

    function noise(at, dur, vol) {
        if (!bgmGain) return;
        if (!noiseBuf) {
            noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.4, actx.sampleRate);
            const d = noiseBuf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        const src = actx.createBufferSource();
        src.buffer = noiseBuf;
        const hp = actx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 5200;
        const g = actx.createGain();
        g.gain.setValueAtTime(vol, at);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        src.connect(hp).connect(g).connect(bgmGain);
        src.start(at);
        src.stop(at + dur + 0.02);
    }

    function toggleBGM() {
        audioOn();
        bgmOn = !bgmOn;
        if (bgmOn) startBGM();
    }

    /* ------------------------- 레벨 ------------------------- */
    function loadLevel(i) {
        const map = LEVELS[i];
        grid = map.map(function (row) { return row.split(''); });

        enemies = []; bubbles = []; fruits = []; letters = []; particles = [];
        let start = { x: 2 * TS, y: 12 * TS };
        let n = 0;

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const ch = grid[r][c];
                if (ch === 'P') { start = { x: c * TS, y: r * TS }; grid[r][c] = '.'; }
                else if (ch === 'E') {
                    enemies.push(makeEnemy(c * TS + 2, r * TS + 2, i, n++));
                    grid[r][c] = '.';
                }
            }
        }

        player = {
            x: start.x + 2, y: start.y + 3, w: 12, h: 13,
            vx: 0, vy: 0, dir: 1, onGround: false,
            invincible: 60, shootCooldown: 0, squash: 0, blink: 0, walk: 0
        };
    }

    function makeEnemy(x, y, stage, n) {
        const speed = 0.6 + stage * 0.06;
        return {
            x: x, y: y, w: 12, h: 12,
            vx: (n % 2 === 0 ? -1 : 1) * speed,
            vy: 0, speed: speed, type: n % 3,
            onGround: false, angry: false, anim: (n * 17) % 90
        };
    }

    /* ------------------------- 물리 ------------------------- */
    // 발판 간격은 4칸(64px). 점프 최고점이 85px 라 여유 있게 올라선다
    const GRAVITY = 0.34, MAX_FALL = 7.5, JUMP_V = -7.6, RUN_SPEED = 1.8;

    function solid(c, r) {
        if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
        return grid[r][c] === '#';
    }

    function moveX(e) {
        e.hitWall = false;
        e.x += e.vx;
        const top = Math.floor(e.y / TS);
        const bottom = Math.floor((e.y + e.h - 1) / TS);
        if (e.vx > 0) {
            const c = Math.floor((e.x + e.w - 1) / TS);
            for (let r = top; r <= bottom; r++) {
                if (solid(c, r)) { e.x = c * TS - e.w; e.hitWall = true; break; }
            }
        } else if (e.vx < 0) {
            const c = Math.floor(e.x / TS);
            for (let r = top; r <= bottom; r++) {
                if (solid(c, r)) { e.x = (c + 1) * TS; e.hitWall = true; break; }
            }
        }
    }

    // 발판은 위에서 내려올 때만 막는다 (아래에서 뚫고 올라갈 수 있음)
    // 발밑 타일을 (y + h) 기준으로 보기 때문에, 바닥에 서 있는 동안
    // onGround 가 매 프레임 유지된다. (예전에는 한 프레임씩 끊겨서 점프가 씹혔다)
    function moveY(e) {
        const prevBottom = e.y + e.h;
        e.y += e.vy;
        e.onGround = false;
        const left = Math.floor(e.x / TS);
        const right = Math.floor((e.x + e.w - 1) / TS);
        if (e.vy >= 0) {
            const r = Math.floor((e.y + e.h) / TS);
            const tol = Math.max(1, e.vy);
            for (let c = left; c <= right; c++) {
                if (solid(c, r) && prevBottom <= r * TS + tol) {
                    e.y = r * TS - e.h; e.vy = 0; e.onGround = true;
                    break;
                }
            }
        }
        if (e.y < 0) { e.y = 0; if (e.vy < 0) e.vy = 0; }
        if (e.y > PLAY_H) e.y = -e.h;
    }

    function overlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    /* ------------------------- 업데이트 ------------------------- */
    function update() {
        frame++;
        if (pressed.mute) toggleBGM();

        if (state === 'title') {
            if (pressed.start || pressed.jump || pressed.shoot) startGame();
            updateParticles();
            return;
        }

        // 오프닝 / 엔딩 컷신은 아무 키나 누르면 건너뛴다
        if (state === 'story' || state === 'ending') {
            const list = state === 'story' ? STORY : ENDING;
            storyTimer++;
            if (pressed.start || pressed.jump || pressed.shoot) { finishStory(); return; }
            if (storyTimer >= list[storyIndex].d) {
                storyIndex++;
                storyTimer = 0;
                if (storyIndex >= list.length) finishStory();
            }
            return;
        }

        if (state === 'gameover' || state === 'allclear') {
            timer++;
            updateParticles();
            if (timer > 45 && (pressed.start || pressed.jump || pressed.shoot)) {
                state = 'title'; timer = 0;
            }
            return;
        }

        if (state === 'cleared') {
            timer--;
            player.walk++;
            updateParticles();
            updateFruits();
            updateLetters();
            if (timer <= 0) {
                levelIndex++;
                if (levelIndex >= LEVELS.length) {
                    state = 'ending';
                    storyIndex = 0; storyTimer = 0;
                    if (score > best) best = score;
                } else {
                    loadLevel(levelIndex);
                    state = 'playing';
                }
            }
            return;
        }

        if (state === 'dying') {
            timer--;
            updateParticles();
            updateBubbles();
            if (timer <= 0) {
                if (lives <= 0) {
                    state = 'gameover'; timer = 0;
                    if (score > best) best = score;
                } else {
                    loadLevel(levelIndex);
                    state = 'playing';
                }
            }
            return;
        }

        updatePlayer();
        updateEnemies();
        updateBubbles();
        updateFruits();
        updateLetters();
        updateParticles();

        const trapped = bubbles.some(function (b) { return b.captured; });
        if (enemies.length === 0 && !trapped) {
            state = 'cleared';
            timer = 120;
            jingle([660, 880, 1046]);
        }
    }

    function startGame() {
        score = 0; lives = 3; levelIndex = 0;
        extend = [false, false, false, false, false, false];
        loadLevel(0);
        storyIndex = 0; storyTimer = 0;
        state = 'story';
        jingle([523, 659, 784]);
    }

    function finishStory() {
        if (state === 'story') {
            state = 'playing';
        } else {
            state = 'allclear';
            timer = 0;
        }
    }

    function updatePlayer() {
        const p = player;
        if (p.invincible > 0) p.invincible--;
        if (p.shootCooldown > 0) p.shootCooldown--;
        if (p.squash > 0) p.squash--;
        if (p.blink > 0) p.blink--;
        else if (Math.random() < 0.006) p.blink = 8;

        if (keys.left && !keys.right) { p.vx = -RUN_SPEED; p.dir = -1; p.walk++; }
        else if (keys.right && !keys.left) { p.vx = RUN_SPEED; p.dir = 1; p.walk++; }
        else { p.vx = 0; p.walk = 0; }

        // 착지 직전/직후에 누른 점프도 살려준다 (특히 터치 조작)
        if (pressed.jump) p.jumpBuffer = 8;
        else if (p.jumpBuffer > 0) p.jumpBuffer--;
        if (p.onGround) p.coyote = 6;
        else if (p.coyote > 0) p.coyote--;

        if (p.jumpBuffer > 0 && p.coyote > 0) {
            p.vy = JUMP_V;
            p.onGround = false;
            p.jumpBuffer = 0; p.coyote = 0;
            p.squash = 6;
            beep(500, 0.07, 'square', 0.04);
        }

        const wasFalling = p.vy > 1;
        p.vy = Math.min(p.vy + GRAVITY, MAX_FALL);
        moveX(p);
        moveY(p);
        if (p.onGround && wasFalling) p.squash = 5;

        // 빈 버블 위에서 통통 튄다
        if (p.vy > 0) {
            for (const b of bubbles) {
                if (b.captured || b.popping) continue;
                if (p.x + p.w > b.x + 2 && p.x < b.x + b.w - 2 &&
                    p.y + p.h > b.y && p.y + p.h < b.y + b.h * 0.7) {
                    p.y = b.y - p.h;
                    p.vy = keys.jump ? JUMP_V : -3.1;
                    p.squash = 6;
                    b.life = Math.max(b.life - 30, 10);
                    beep(760, 0.05, 'sine', 0.04);
                    break;
                }
            }
        }

        if (pressed.shoot && p.shootCooldown === 0 && bubbles.length < 12) {
            bubbles.push({
                x: p.x + (p.dir > 0 ? p.w - 2 : -12), y: p.y - 1,
                w: 14, h: 14,
                vx: p.dir * 3.7, vy: 0,
                travel: 26, life: 460, captured: null,
                popping: 0, wobble: Math.random() * 6.28
            });
            p.shootCooldown = 11;
            beep(900, 0.05, 'sine', 0.05);
        }

        if (p.invincible === 0) {
            for (const e of enemies) {
                if (overlap(p, e)) { killPlayer(); return; }
            }
        }
    }

    function killPlayer() {
        lives--;
        state = 'dying';
        timer = 90;
        burst(player.x + 6, player.y + 6, '#cdd8f5', 14);
        burst(player.x + 6, player.y + 6, '#ff7fae', 8);
        beep(220, 0.3, 'sawtooth', 0.07);
        setTimeout(function () { beep(130, 0.4, 'sawtooth', 0.07); }, 170);
    }

    function updateEnemies() {
        for (const e of enemies) {
            e.anim++;
            const speed = e.angry ? e.speed * 1.8 : e.speed;
            e.vx = (e.vx >= 0 ? 1 : -1) * speed;

            e.vy = Math.min(e.vy + GRAVITY, MAX_FALL);
            moveX(e);
            if (e.hitWall) e.vx = -e.vx;
            moveY(e);

            // 발판 끝에서는 돌아서고, 아주 가끔 그대로 떨어지거나 폴짝 뛴다
            if (e.onGround) {
                const aheadC = Math.floor((e.vx > 0 ? e.x + e.w + 1 : e.x - 1) / TS);
                const belowR = Math.floor((e.y + e.h + 1) / TS);
                if (!solid(aheadC, belowR) && Math.random() > 0.02) e.vx = -e.vx;
                if (Math.random() < 0.002) e.vy = JUMP_V * 0.85;
            }
        }
    }

    function updateBubbles() {
        for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i];

            if (b.popping > 0) {
                b.popping--;
                if (b.popping === 0) bubbles.splice(i, 1);
                continue;
            }

            b.life--;
            b.wobble += 0.09;

            if (b.travel > 0) {
                b.travel--;
                b.x += b.vx;
                const r0 = Math.floor(b.y / TS), r1 = Math.floor((b.y + b.h - 1) / TS);
                const c = b.vx > 0 ? Math.floor((b.x + b.w - 1) / TS) : Math.floor(b.x / TS);
                for (let r = r0; r <= r1; r++) {
                    if (solid(c, r)) { b.x -= b.vx; b.travel = 0; break; }
                }
                if (b.travel === 0) b.vx = 0;
            } else {
                b.y -= b.captured ? 0.38 : 0.48;
                b.x += Math.sin(b.wobble) * 0.3;
                if (b.y < TS + 1) { b.y = TS + 1; b.life -= 2; }
            }

            if (!b.captured) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (overlap(b, enemies[j])) {
                        b.captured = enemies[j];
                        b.life = 340;
                        b.vx = 0; b.travel = 0;
                        enemies.splice(j, 1);
                        beep(320, 0.12, 'sine', 0.06);
                        break;
                    }
                }
            }

            if (state === 'playing' && b.captured && overlap(b, player)) {
                popBubble(i, true);
                continue;
            }

            if (b.life <= 0) popBubble(i, false);
        }
    }

    function popBubble(index, byPlayer) {
        const b = bubbles[index];
        if (!b || b.popping > 0) return;

        if (b.captured && byPlayer) {
            score += 500;
            const idx = Math.floor(Math.random() * FRUITS.length);
            fruits.push({
                x: b.x + 1, y: b.y + 1, w: 10, h: 10,
                vy: 0, life: 460, idx: idx
            });
            burst(b.x + 7, b.y + 7, '#ff9ed2', 12);
            burst(b.x + 7, b.y + 7, '#ffe14d', 6);
            beep(1046, 0.08, 'square', 0.05);
            setTimeout(function () { beep(1318, 0.1, 'square', 0.05); }, 70);

            // EXTEND 글자 버블은 가끔 등장한다
            const missing = [];
            for (let k = 0; k < LETTERS.length; k++) if (!extend[k]) missing.push(k);
            if (missing.length && Math.random() < 0.3) {
                const li = missing[Math.floor(Math.random() * missing.length)];
                letters.push({
                    x: b.x, y: b.y, w: 14, h: 14,
                    vx: (Math.random() < 0.5 ? -1 : 1) * 0.5,
                    life: 620, idx: li, wobble: Math.random() * 6.28
                });
            }

            // 가까운 버블은 연쇄로 터진다
            for (let k = bubbles.length - 1; k >= 0; k--) {
                const o = bubbles[k];
                if (o === b || o.popping > 0) continue;
                const dx = o.x - b.x, dy = o.y - b.y;
                if (dx * dx + dy * dy < 30 * 30) popBubble(k, true);
            }
        } else if (b.captured) {
            const e = b.captured;
            e.x = b.x + 1; e.y = b.y + 1; e.vy = 0; e.angry = true;
            enemies.push(e);
            beep(170, 0.16, 'sawtooth', 0.06);
        } else {
            burst(b.x + 7, b.y + 7, '#8fe3ff', 6);
        }

        b.captured = null;
        b.popping = 6;
    }

    function updateFruits() {
        for (let i = fruits.length - 1; i >= 0; i--) {
            const f = fruits[i];
            f.life--;
            f.vy = Math.min(f.vy + GRAVITY, MAX_FALL);
            moveY(f);
            if (state === 'playing' && overlap(f, player)) {
                const gained = FRUITS[f.idx].score;
                score += gained;
                particles.push({ text: '+' + gained, x: f.x + 5, y: f.y, vy: -0.5, life: 45, color: '#ffe14d' });
                burst(f.x + 5, f.y + 5, '#ffe14d', 5);
                fruits.splice(i, 1);
                beep(784, 0.07, 'triangle', 0.06);
                continue;
            }
            if (f.life <= 0) fruits.splice(i, 1);
        }
    }

    function updateLetters() {
        for (let i = letters.length - 1; i >= 0; i--) {
            const l = letters[i];
            l.life--;
            l.wobble += 0.07;
            l.x += l.vx;
            l.y += Math.sin(l.wobble) * 0.35 - 0.12;
            if (l.x < TS || l.x + l.w > W - TS) l.vx = -l.vx;
            if (l.y < TS) l.y = TS;

            if (state === 'playing' && overlap(l, player)) {
                extend[l.idx] = true;
                score += 500;
                particles.push({ text: LETTERS[l.idx], x: l.x + 7, y: l.y, vy: -0.5, life: 45, color: LETTER_COLORS[l.idx] });
                burst(l.x + 7, l.y + 7, LETTER_COLORS[l.idx], 8);
                letters.splice(i, 1);
                beep(988, 0.09, 'square', 0.06);

                if (extend.every(Boolean)) {
                    extend = [false, false, false, false, false, false];
                    lives++;
                    score += 5000;
                    particles.push({ text: '1UP!', x: player.x + 6, y: player.y - 12, vy: -0.4, life: 90, color: '#ff4f88' });
                    for (let k = 0; k < 10; k++) {
                        particles.push({
                            heart: true, x: player.x + 6, y: player.y,
                            vx: (Math.random() - 0.5) * 2.4, vy: -1 - Math.random() * 1.6,
                            life: 60, color: '#ff4f88'
                        });
                    }
                    jingle([784, 988, 1175, 1568]);
                }
                continue;
            }
            if (l.life <= 0) letters.splice(i, 1);
        }
    }

    function burst(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 * i) / count + Math.random() * 0.4;
            const s = 0.7 + Math.random() * 1.3;
            particles.push({
                x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                life: 16 + Math.random() * 12, color: color
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life--;
            p.x += p.vx || 0;
            p.y += p.vy || 0;
            if (p.vx !== undefined) p.vy += 0.07;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    /* ------------------------- 그리기 ------------------------- */
    const stars = [];
    for (let i = 0; i < 46; i++) {
        stars.push({ x: (Math.random() * W) | 0, y: (Math.random() * PLAY_H) | 0, p: (Math.random() * 100) | 0 });
    }

    function draw() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, H);

        for (const s of stars) {
            const t = (frame + s.p) % 120;
            if (t < 60) {
                ctx.fillStyle = t < 30 ? '#3a2a6a' : '#5a3f9a';
                ctx.fillRect(s.x, s.y, 1, 1);
            }
        }

        if (state === 'story' || state === 'ending') { drawStory(); return; }
        if (state === 'title') { drawTitle(); return; }

        drawLevel();
        for (const f of fruits) blit(SPR.fruit[f.idx], f.x - 1, f.y - 1, false);
        for (const e of enemies) drawEnemy(e);
        if (state !== 'dying') drawPlayer();
        for (const b of bubbles) drawBubble(b);
        for (const l of letters) drawLetter(l);
        drawParticles();
        drawHUD();
        drawPanel();

        const mid = PLAY_H / 2;
        if (state === 'cleared') {
            banner();
            drawTextCenter('STAGE CLEAR!', W / 2, mid - 16, '#5bdc4a', 2);
            drawKo('잘했어!', 11, '#ffe14d', W / 2, mid + 4);
        }
        if (state === 'dying') {
            banner();
            drawKo('아야!', 13, '#ff7fae', W / 2, mid - 14);
        }
        if (state === 'gameover') {
            banner();
            drawTextCenter('GAME OVER', W / 2, mid - 18, '#ff4f6d', 2);
            drawTextCenter('SCORE ' + score, W / 2, mid + 6, '#ffe14d', 1);
            if (Math.floor(frame / 25) % 2 === 0) {
                drawTextCenter('PUSH ENTER', W / 2, mid + 20, '#ffffff', 1);
            }
        }
        if (state === 'allclear') {
            banner();
            drawTextCenter('ALL CLEAR!', W / 2, mid - 18, '#ffe14d', 2);
            drawTextCenter('SCORE ' + score, W / 2, mid + 6, '#5bdc4a', 1);
            if (Math.floor(frame / 25) % 2 === 0) {
                drawTextCenter('PUSH ENTER', W / 2, mid + 20, '#ffffff', 1);
            }
        }
    }

    function banner() {
        const mid = PLAY_H / 2;
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(0, mid - 28, W, 58);
        ctx.fillStyle = '#ff2e88';
        ctx.fillRect(0, mid - 29, W, 1);
        ctx.fillRect(0, mid + 30, W, 1);
    }

    function drawLevel() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (r === 0) continue;   // 맨 윗줄은 점수판이 차지한다
                if (grid[r][c] === '#') blit(SPR.tile, c * TS, r * TS, false);
            }
        }
    }

    function drawPlayer() {
        const p = player;
        if (p.invincible > 0 && Math.floor(frame / 3) % 2 === 0) return;

        let y = p.y - 3;
        if (p.walk > 0 && p.onGround && Math.floor(p.walk / 6) % 2 === 0) y -= 1;
        if (p.squash > 0) y += 1;

        blit(p.blink > 0 ? SPR.raccoonBlink : SPR.raccoon, p.x - 2, y, p.dir < 0);
    }

    function drawEnemy(e) {
        const bob = Math.sin(e.anim * 0.12) < 0 ? 1 : 0;
        const set = e.angry ? SPR.enemyAngry : SPR.enemy;
        blit(set[e.type], e.x - 2, e.y - 4 + bob, e.vx < 0);

        if (e.angry && Math.floor(frame / 8) % 2 === 0) {
            drawText('!', Math.round(e.x + 4), Math.round(e.y - 12), '#ff4f6d', 1);
        }
    }

    function drawBubble(b) {
        if (b.popping > 0) {
            const t = 6 - b.popping;
            ctx.fillStyle = '#cdf3ff';
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI * 2 * i) / 8;
                ctx.fillRect(Math.round(b.x + 7 + Math.cos(a) * (5 + t * 2)),
                             Math.round(b.y + 7 + Math.sin(a) * (5 + t * 2)), 1, 1);
            }
            return;
        }

        const hot = b.captured && b.life < 90 && Math.floor(frame / 5) % 2 === 0;

        if (b.captured) {
            const e = b.captured;
            e.x = b.x + 1; e.y = b.y + 1;
            const set = e.angry ? SPR.enemyAngry : SPR.enemy;
            blit(set[e.type], b.x - 1, b.y - 2, false);

            // 어질어질 반짝임
            for (let i = 0; i < 3; i++) {
                const a = frame * 0.12 + (Math.PI * 2 * i) / 3;
                ctx.fillStyle = '#ffe14d';
                ctx.fillRect(Math.round(b.x + 7 + Math.cos(a) * 8), Math.round(b.y + 1 + Math.sin(a) * 3), 1, 1);
            }
        }

        blit(hot ? SPR.bubbleHot : SPR.bubble, b.x - 1, b.y - 1, false);
    }

    function drawLetter(l) {
        blit(SPR.letter[l.idx], l.x - 1, l.y - 1, false);
        drawText(LETTERS[l.idx], Math.round(l.x + 5), Math.round(l.y + 4), LETTER_COLORS[l.idx], 1);
    }

    function drawParticles() {
        for (const p of particles) {
            if (p.life < 6 && Math.floor(frame / 2) % 2 === 0) continue;
            if (p.text) {
                drawTextCenter(p.text, p.x, p.y, p.color, 1);
            } else if (p.heart) {
                blit(SPR.heart, p.x - 4, p.y - 4, false);
            } else {
                ctx.fillStyle = p.color;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
            }
        }
    }

    function drawHUD() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, W, TS);
        ctx.fillStyle = '#2a1140';
        ctx.fillRect(0, TS - 1, W, 1);

        drawText('SCORE ' + score, 4, 4, '#ffe14d', 1);
        drawTextCenter('ST ' + (levelIndex + 1) + '/' + LEVELS.length, 152, 4, '#8fe3ff', 1);

        for (let i = 0; i < Math.min(lives, 5); i++) {
            blit(SPR.heart, W - 10 - i * 9, 4, false);
        }
    }

    // 화면 아래쪽 조작판. 버튼 그림은 여기서 그리고 터치 판정은 투명한 HTML 버튼이 받는다
    function drawPanel() {
        ctx.fillStyle = '#150a28';
        ctx.fillRect(0, PANEL_Y, W, H - PANEL_Y);
        ctx.fillStyle = '#ff2e88';
        ctx.fillRect(0, PANEL_Y, W, 2);

        for (let i = 0; i < LETTERS.length; i++) drawChip(102 + i * 14, 344, i, extend[i]);

        drawPadButton(6, 396, keys.left, 'left');
        drawPadButton(76, 396, keys.right, 'right');
        drawPadButton(146, 396, keys.shoot, 'bubble');
        drawPadButton(216, 396, keys.jump, 'jump');
        drawMute(250, 342);
    }

    function drawPadButton(x, y, pressed, kind) {
        const size = 64;
        const oy = pressed ? 2 : 0;
        ctx.fillStyle = '#3d1f6b';
        ctx.fillRect(x + 2, y + 4, size - 4, size - 2);
        ctx.fillStyle = pressed ? '#ff2e88' : '#2a1140';
        ctx.fillRect(x, y + oy, size, size - 4);
        ctx.fillStyle = pressed ? '#ffd9f0' : '#6c4ec7';
        ctx.fillRect(x, y + oy, size, 2);
        ctx.fillRect(x, y + oy + size - 6, size, 2);
        ctx.fillRect(x, y + oy, 2, size - 4);
        ctx.fillRect(x + size - 2, y + oy, 2, size - 4);

        const cx = x + size / 2, cy = y + oy + size / 2 - 2;
        ctx.fillStyle = pressed ? '#ffffff' : '#ffe14d';
        if (kind === 'left' || kind === 'right') {
            const d = kind === 'left' ? -1 : 1;
            for (let i = 0; i < 12; i++) {
                ctx.fillRect(cx - d * 6 + d * i, cy - (11 - i) / 2, 2, 11 - i);
            }
        } else if (kind === 'jump') {
            for (let i = 0; i < 11; i++) ctx.fillRect(cx - i, cy - 5 + i, i * 2 + 2, 2);
        } else {
            for (let i = 0; i < 16; i++) {
                const a = (Math.PI * 2 * i) / 16;
                ctx.fillRect(cx + Math.cos(a) * 11 - 1, cy + Math.sin(a) * 11 - 1, 3, 3);
            }
        }
    }

    function drawMute(x, y) {
        ctx.fillStyle = '#2a1140';
        ctx.fillRect(x, y, 28, 28);
        ctx.fillStyle = '#6c4ec7';
        ctx.fillRect(x, y, 28, 2); ctx.fillRect(x, y + 26, 28, 2);
        ctx.fillRect(x, y, 2, 28); ctx.fillRect(x + 26, y, 2, 28);

        ctx.fillStyle = bgmOn ? '#ffe14d' : '#5a4a8a';
        ctx.fillRect(x + 7, y + 11, 4, 6);
        for (let i = 0; i < 5; i++) ctx.fillRect(x + 11 + i, y + 11 - i, 2, 6 + i * 2);
        if (bgmOn) {
            for (let i = 0; i < 3; i++) ctx.fillRect(x + 19 + i * 2, y + 10 + i, 1, 8 - i * 2);
        } else {
            ctx.fillStyle = '#ff4f6d';
            for (let i = 0; i < 7; i++) ctx.fillRect(x + 18 + i, y + 9 + i, 2, 2);
        }
    }

    // 레퍼런스의 알파벳 구슬 느낌: 모서리를 깎은 10x10 동그란 칩
    function drawChip(x, y, i, lit) {
        ctx.fillStyle = lit ? LETTER_COLORS[i] : '#241b45';
        ctx.fillRect(x + 1, y, 8, 10);
        ctx.fillRect(x, y + 1, 10, 8);
        if (lit) {
            ctx.fillStyle = 'rgba(255,255,255,0.65)';
            ctx.fillRect(x + 2, y + 2, 2, 1);
        }
        drawText(LETTERS[i], x + 3, y + 2, lit ? '#241b45' : '#4a3f7a', 1);
    }

    /* ------------------------- 컷신 ------------------------- */
    function drawStory() {
        const list = state === 'story' ? STORY : ENDING;
        const sc = list[Math.min(storyIndex, list.length - 1)];
        sc.draw(storyTimer / sc.d);
        storyPanel(sc.a, sc.b, storyTimer / sc.d);

        if (Math.floor(frame / 30) % 2 === 0) {
            drawTextCenter('TAP TO SKIP', W / 2, 478, '#6a5aa8', 1);
        }
    }

    // 대사는 완성된 줄의 위치를 먼저 잡고 왼쪽부터 타자기처럼 채운다
    function storyPanel(a, b, t) {
        ctx.fillStyle = '#150a28';
        ctx.fillRect(0, PANEL_Y, W, H - PANEL_Y);
        ctx.fillStyle = '#ff2e88';
        ctx.fillRect(0, PANEL_Y, W, 2);

        const shown = Math.ceil((a.length + b.length) * Math.min(1, t * 2.6));
        const la = koText(a, 12, '#fff6dd'), lb = koText(b, 12, '#ffd9f0');
        drawKoAt(a.slice(0, Math.min(a.length, shown)), 12, '#fff6dd', W / 2 - la.w, 368);
        if (shown > a.length) {
            drawKoAt(b.slice(0, shown - a.length), 12, '#ffd9f0', W / 2 - lb.w, 412);
        }
        drawMute(250, 342);
    }

    function storySky(dark) {
        ctx.fillStyle = '#0d0722';
        ctx.fillRect(0, 0, W, H);
        for (const st of stars) {
            const t = (frame + st.p) % 120;
            if (t < 60) {
                ctx.fillStyle = t < 30 ? '#3a2a6a' : '#7a5fc0';
                ctx.fillRect(st.x, st.y % 246, 1, 1);
            }
        }
        if (dark > 0) {
            ctx.fillStyle = 'rgba(58, 0, 84, ' + (dark * 0.6) + ')';
            ctx.fillRect(0, 0, W, H);
        }
    }

    function storyGround() {
        for (let c = 0; c < COLS; c++) blit(SPR.tile, c * TS, 248, false);
        ctx.fillStyle = '#140b26';
        ctx.fillRect(0, 264, W, PANEL_Y - 264);
    }

    function storyGirl(x, y, flip) {
        blit(SPR.girl, x, y, flip);
        blit(SPR.flower, flip ? x + 1 : x + 10, y - 2, flip);
    }

    function sparkle(x, y, color) {
        ctx.fillStyle = color;
        const r = 3 + Math.sin(frame * 0.3) * 2;
        ctx.fillRect(x, y - r, 1, 2);
        ctx.fillRect(x, y + r, 1, 2);
        ctx.fillRect(x - r, y, 2, 1);
        ctx.fillRect(x + r, y, 2, 1);
    }

    function sceneMeet() {
        storySky(0);
        storyGround();
        const bob = Math.sin(frame * 0.08) * 2;
        blit(SPR.raccoon, 118, 232 + bob, false);
        storyGirl(148, 232 - bob, true);
        for (let i = 0; i < 3; i++) {
            const p = ((frame + i * 45) % 135) / 135;
            ctx.globalAlpha = 1 - p;
            blit(SPR.heart, 138 + Math.sin(p * 6.3 + i * 2) * 5, 226 - p * 70, false);
            ctx.globalAlpha = 1;
        }
    }

    function sceneVillain(t) {
        storySky(t);
        storyGround();
        blit(SPR.raccoon, 118, 232, false);
        storyGirl(148, 232, true);
        blit(SPR.boss, W / 2 - 12, -32 + Math.min(1, t * 1.8) * 180, false);
        if (t > 0.3 && Math.floor(frame / 8) % 2 === 0) {
            drawText('!', 124, 218, '#ffe14d', 1);
            drawText('!', 154, 218, '#ff5fa2', 1);
        }
    }

    function sceneKidnap(t) {
        storySky(0.65);
        storyGround();
        blit(SPR.raccoon, 44, 232, false);
        const gx = 128 + t * 44, gy = 200 - t * 84;
        blit(SPR.boss, gx + 26, gy - 36, false);
        storyGirl(gx, gy, false);
        blit(SPR.bubble, gx - 1, gy - 1, false);
        if (Math.floor(frame / 10) % 2 === 0) drawText('!', 50, 218, '#ffe14d', 1);
    }

    function sceneAlone() {
        storySky(0.4);
        storyGround();
        blit(SPR.raccoon, W / 2 - 8, 232, false);
        for (let i = 0; i < 2; i++) {
            const p = ((frame + i * 30) % 60) / 60;
            ctx.fillStyle = '#8fe3ff';
            ctx.fillRect(W / 2 - 4 + i * 9, 240 + p * 10, 1, 2);
        }
        const gap = 2 + Math.sin(frame * 0.05) * 2;
        ctx.globalAlpha = 0.85;
        blit(SPR.heart, W / 2 - 14 - gap, 200, false);
        blit(SPR.heart, W / 2 + 6 + gap, 200, true);
        ctx.globalAlpha = 1;
    }

    function sceneTrain() {
        storySky(0.15);
        storyGround();
        blit(SPR.raccoon, 48, 232, false);
        for (let i = 0; i < 3; i++) {
            const p = ((frame * 1.8 + i * 50) % 150) / 150;
            blit(SPR.bubble, 66 + p * 150, 226 - Math.sin(p * 3.14) * 26, false);
        }
        sparkle(46, 220, '#ffe14d');
    }

    function sceneGo(t) {
        storySky(0.2);
        storyGround();
        drawCastle(204, 184);
        const x = 14 + t * 140;
        const hop = Math.abs(Math.sin(frame * 0.22)) * 5;
        blit(SPR.raccoon, x, 232 - hop, false);
        ctx.fillStyle = '#4a3f7a';
        for (let i = 0; i < 3; i++) ctx.fillRect(x - 5 - i * 5, 246, 2, 1);
    }

    function drawCastle(x, y) {
        ctx.fillStyle = '#2a1a4d';
        ctx.fillRect(x, y + 18, 62, 46);
        ctx.fillRect(x + 4, y, 14, 24);
        ctx.fillRect(x + 44, y, 14, 24);
        ctx.fillStyle = '#1a0f33';
        ctx.fillRect(x + 25, y + 42, 12, 22);
        if (Math.floor(frame / 30) % 2 === 0) {
            ctx.fillStyle = '#ffe14d';
            ctx.fillRect(x + 8, y + 8, 5, 5);
            ctx.fillRect(x + 48, y + 8, 5, 5);
        }
    }

    function sceneRescue(t) {
        storySky(0.45 * (1 - t));
        storyGround();
        blit(SPR.raccoon, 52, 232, false);
        if (t < 0.55) {
            if (Math.floor(frame / 4) % 2 === 0) {
                blit(SPR.boss, 186 + Math.sin(frame * 0.9) * 2, 186, false);
            }
            for (let i = 0; i < 4; i++) {
                const p = ((frame * 2.2 + i * 38) % 150) / 150;
                blit(SPR.bubble, 70 + p * 108, 224 - Math.sin(p * 3.14) * 24, false);
            }
        } else {
            const k = (t - 0.55) / 0.45;
            for (let i = 0; i < 12; i++) {
                const a = (Math.PI * 2 * i) / 12;
                ctx.fillStyle = i % 2 ? '#c86bff' : '#ffe14d';
                ctx.fillRect(196 + Math.cos(a) * k * 46, 200 + Math.sin(a) * k * 46, 2, 2);
            }
            storyGirl(186, 232, true);
        }
    }

    function sceneReunion() {
        storySky(0);
        storyGround();
        const bob = Math.sin(frame * 0.08) * 2;
        blit(SPR.raccoon, 116, 232 + bob, false);
        storyGirl(146, 232 - bob, true);
        for (let i = 0; i < 5; i++) {
            const p = ((frame * 1.2 + i * 30) % 150) / 150;
            ctx.globalAlpha = 1 - p;
            blit(SPR.heart, 104 + i * 14 + Math.sin(p * 6.3 + i) * 4, 226 - p * 90, false);
            ctx.globalAlpha = 1;
        }
    }

    function drawTitle() {
        const float = Math.sin(frame * 0.05) * 3;

        drawKo('보글보글', 16, '#ffe14d', W / 2, 44 + float);
        drawTextCenter('BUBBLE RACCOON', W / 2, 104 + float, '#ff2e88', 1);

        // 마스코트 한 줄
        blit(SPR.raccoon, W / 2 - 46, 140 + float, false);
        blit(SPR.bubble, W / 2 - 8, 138 + float, false);
        blit(SPR.enemy[0], W / 2 + 26, 140 + float, true);

        drawKo('버블에 가두고 터뜨리자!', 11, '#ff9ed2', W / 2, 176);

        blit(SPR.enemy[1], 40, 218 + Math.sin(frame * 0.06) * 3, false);
        blit(SPR.fruit[0], 82, 222, false);
        blit(SPR.fruit[4], 130, 222, false);
        blit(SPR.fruit[5], 178, 222, false);
        blit(SPR.enemy[2], 224, 218 + Math.sin(frame * 0.06 + 2) * 3, true);

        for (let i = 0; i < LETTERS.length; i++) drawChip(102 + i * 14, 262, i, true);
        drawTextCenter('COLLECT EXTEND FOR 1UP', W / 2, 284, '#8fe3ff', 1);

        ctx.fillStyle = '#150a28';
        ctx.fillRect(0, PANEL_Y, W, H - PANEL_Y);
        ctx.fillStyle = '#ff2e88';
        ctx.fillRect(0, PANEL_Y, W, 2);

        drawKo('아래 버튼으로 조작', 10, '#c9a7e8', W / 2, 352);
        drawTextCenter('KEYBOARD', W / 2, 392, '#6a5aa8', 1);
        drawTextCenter('ARROW MOVE  SPACE JUMP', W / 2, 406, '#8fe3ff', 1);
        drawTextCenter('Z BUBBLE   M MUSIC', W / 2, 420, '#8fe3ff', 1);

        if (best > 0) drawTextCenter('BEST ' + best, W / 2, 442, '#5bdc4a', 1);

        if (Math.floor(frame / 25) % 2 === 0) {
            drawTextCenter('PUSH START', W / 2, 464, '#ffffff', 2);
        }
        drawMute(250, 342);
    }

    /* ------------------------- 루프 ------------------------- */
    initSprites();
    loadLevel(0);
    state = 'title';

    const gamepad = document.getElementById('gamepad');
    let padShown = null;

    // 조작 버튼은 실제로 플레이할 때만 띄운다 (타이틀/컷신에서는 화면을 가리지 않게)
    function syncPad() {
        const show = (state === 'playing' || state === 'dying' || state === 'cleared');
        if (show !== padShown) {
            padShown = show;
            gamepad.style.display = show ? '' : 'none';
        }
    }

    function loop() {
        update();
        draw();
        syncPad();
        for (const k in pressed) delete pressed[k];
        requestAnimationFrame(loop);
    }

    loop();
})();
</script>

<script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () {});
        });
    }
</script>
